<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>นักล่าราตรี</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#04050d;overflow:hidden;font-family:"Noto Sans Thai","Sarabun","Tahoma",system-ui,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#0b1030}
#cv{position:absolute;left:0;top:0;width:960px;height:540px;display:block}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
button{font-family:inherit;color:#fff;border:0;cursor:pointer}
.scroll,.scroll *{touch-action:pan-y}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:#556;border-radius:3px}
/* ---- ปุ่มควบคุม ---- */
#joy{position:absolute;left:24px;bottom:24px;width:236px;height:84px;border-radius:42px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
#joy .ar{position:absolute;top:22px;font-size:30px;color:rgba(255,255,255,.4);pointer-events:none}
#joy .l{left:16px}#joy .r{right:16px}
#knob{position:absolute;top:9px;left:84px;width:62px;height:62px;border-radius:31px;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);pointer-events:none}
#bj{position:absolute;right:26px;bottom:26px;width:104px;height:104px;border-radius:52px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);font-size:34px;display:flex;align-items:center;justify-content:center}
#bj.on{background:rgba(255,255,255,.35)}
#bp{position:absolute;right:10px;top:70px;width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.3);font-size:20px}
/* ---- เมนู ---- */
.bgm{background:radial-gradient(ellipse at 50% 0,#2a1f55 0,#0b0d24 70%)}
#title{align-items:center;justify-content:center;background:linear-gradient(rgba(5,6,20,.35),rgba(5,6,20,.75));gap:10px}
#title h1{margin:0;font-size:64px;font-weight:800;color:#ffd86b;text-shadow:0 4px 0 #7a3b00,0 0 30px rgba(255,170,0,.6);letter-spacing:2px}
#title .sub{font-size:18px;color:#cfd4ff;margin:-4px 0 12px}
.tbtn{width:340px;padding:11px 0;font-size:25px;font-weight:800;border-radius:16px;background:linear-gradient(#5a5f9a,#3a3e72);box-shadow:0 4px 0 #1c1e3d;margin:3px 0}
.tbtn.p{background:linear-gradient(#ff9a3c,#e2531b);box-shadow:0 4px 0 #7a2a05,0 0 20px rgba(255,120,0,.4);font-size:30px}
.tbtn:active{transform:translateY(2px)}
#tinfo{position:absolute;left:18px;bottom:12px;font-size:15px;color:#bcc3ee}
#menu,#codex,#setg{padding:14px 22px 12px}
.top{display:flex;align-items:center;gap:12px;height:44px}
.back{width:46px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);font-size:20px;font-weight:800}
.title{font-size:28px;font-weight:800;letter-spacing:1px;color:#ffd86b;text-shadow:0 2px 0 #7a3b00,0 0 18px rgba(255,170,0,.5);flex:1}
.gold{font-size:22px;font-weight:700;background:rgba(0,0,0,.4);padding:4px 16px;border-radius:20px;color:#ffe27a}
.tabs{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.tabs button{padding:6px 22px;border-radius:10px;background:rgba(255,255,255,.1);font-size:16px;font-weight:700;border:2px solid transparent}
.tabs button.on{background:#e2a82b;color:#2a1600}
#codex .tabs button.on{background:rgba(255,255,255,.14);color:#fff}
#mbody,#cbody{flex:1;min-height:0;display:flex;gap:14px}
.chars{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;width:560px}
.cc{width:104px;height:150px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;padding:6px 2px;font-size:14px;font-weight:700;position:relative}
.cc canvas{width:76px;height:86px}
.cc.view{border-color:#ffd86b;background:rgba(255,216,107,.15)}
.cc.sel::after{content:"ใช้งาน";position:absolute;top:-8px;background:#3cb15a;font-size:11px;padding:1px 8px;border-radius:8px}
.cc .pr{font-size:13px;color:#ffe27a}.cc.lock canvas{filter:brightness(.25)}
.cc .lk{position:absolute;top:34px;font-size:26px}
.det{flex:1;background:rgba(0,0,0,.35);border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.35;overflow:hidden}
.det h2{margin:0 0 4px;font-size:24px;color:#ffd86b}
.det .sk{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;margin-top:6px}
.det .sk b{color:#9fe3ff}.det .sk.sg b{color:#ffb4f0}
.det .st{color:#b9c2ff}
.act{margin-top:8px;width:100%;padding:9px;border-radius:12px;font-size:18px;font-weight:800;background:#3cb15a}
.act.buy{background:#e2a82b;color:#2a1600}.act:disabled{background:#555;color:#999}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;width:100%;align-content:start}
.up{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:12px;padding:6px 10px;height:56px}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .tx{flex:1;font-size:13px;line-height:1.2}.up .tx b{font-size:15px}.up .tx span{color:#aab}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{width:14px;height:6px;border-radius:3px;background:#444}.pips i.f{background:#ffd86b}
.up button{background:#e2a82b;color:#2a1600;font-weight:800;border-radius:10px;padding:8px 10px;min-width:78px;font-size:14px}
.up button:disabled{background:#4a4a55;color:#999}
.bot{display:flex;align-items:center;justify-content:space-between;height:60px;padding-top:6px}
#best{font-size:16px;color:#aab}
.big{font-size:28px;font-weight:800;padding:8px 54px;border-radius:16px;background:linear-gradient(#ff9a3c,#e2531b);box-shadow:0 4px 0 #7a2a05,0 0 20px rgba(255,120,0,.45)}
.big:active{transform:translateY(2px)}
/* ---- ดัชนี ---- */
.cx{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;align-content:start;padding:2px 4px 8px 2px}
.cxc{border-radius:14px;background:rgba(255,255,255,.06);border:2px solid var(--c);padding:8px 10px;height:132px;font-size:13px;line-height:1.3;position:relative;box-shadow:0 0 12px -4px var(--c)}
.cxc .ic{font-size:30px;float:left;margin-right:8px;line-height:36px}
.cxc b{font-size:16px;color:var(--c)}
.cxc .ds{color:#d5d9ff;margin-top:4px;clear:both}
.cxc .nm{color:#9aa;font-size:12px;position:absolute;bottom:6px;left:10px}
.cxh{grid-column:1/-1;font-size:14px;color:#bcc3ee;padding:2px 2px}
/* ---- ตั้งค่า ---- */
.setrows{display:flex;flex-direction:column;gap:10px;width:560px;margin:14px auto 0}
.srow{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 18px;font-size:20px;font-weight:700}
.srow small{display:block;font-size:13px;color:#aab;font-weight:400}
.tg{width:84px;padding:7px 0;border-radius:18px;font-size:16px;font-weight:800;background:#3cb15a}
.tg.off{background:#6a6a78}
.danger{background:#a83232;border-radius:14px;padding:12px;font-size:18px;font-weight:800}
/* ---- โอเวอร์เลย์ ---- */
.ov{background:rgba(3,4,14,.84);align-items:center;justify-content:center;gap:12px}
.ov h1{margin:0;font-size:36px;color:#ffd86b;text-shadow:0 0 18px rgba(255,170,0,.6)}
.cards{display:flex;gap:18px}
.card{width:232px;height:236px;border-radius:16px;background:linear-gradient(#2c2f5e,#181a38);border:3px solid #6f78ff;padding:12px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;position:relative}
.card:active{transform:translateY(-4px)}
.card .ic{font-size:54px;line-height:64px}
.card .nm{font-size:20px;font-weight:800;margin-top:2px}
.card .lv{font-size:14px;color:#ffd86b;margin-top:2px}
.card .ds{font-size:15px;color:#d5d9ff;margin-top:8px;line-height:1.3}
.card .tg2{position:absolute;top:-11px;color:#06240f;font-size:12px;font-weight:800;padding:2px 12px;border-radius:10px;background:#5de08a;white-space:nowrap}
.card .key{position:absolute;bottom:6px;font-size:12px;color:#889}
.rw{background:rgba(0,0,0,.45);border-radius:14px;padding:8px 18px;text-align:center;max-width:860px}
.rw .rwt{font-size:19px;font-weight:700;color:#ffe27a}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chip{background:rgba(255,255,255,.13);padding:3px 11px;border-radius:10px;font-size:14px}
.rw .rwq{font-size:13px;color:#aab;margin-top:4px}
.rs{background:rgba(0,0,0,.4);padding:14px 34px;border-radius:16px;font-size:21px;line-height:1.6;text-align:center;min-width:330px}
.rs b{color:#ffe27a}
.btnrow{display:flex;gap:14px}
.btn{font-size:22px;font-weight:800;padding:10px 32px;border-radius:14px;background:#3cb15a}
.btn.g{background:#5a5f8a}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="touch" class="hidden">
    <div id="joy"><span class="ar l">◀</span><span class="ar r">▶</span><div id="knob"></div></div>
    <div id="bj">⤒</div>
    <button id="bp">⏸</button>
  </div>

  <div id="title" class="scr">
    <h1>⚔ นักล่าราตรี</h1><div class="sub">เอาชีวิตรอดให้ครบ 100 เวฟ</div>
    <button class="tbtn p" id="t_start">▶ เริ่มเกม</button>
    <button class="tbtn" id="t_index">📖 ดัชนีสกิล</button>
    <button class="tbtn" id="t_set">⚙ ตั้งค่า</button>
    <button class="tbtn" id="t_exit">⏻ ออกเกม</button>
    <div id="tinfo"></div>
  </div>

  <div id="menu" class="scr bgm hidden">
    <div class="top"><button class="back" data-back="1">◀</button><div class="title">เตรียมพร้อม</div><div class="gold">💰 <span id="mgold">0</span></div></div>
    <div class="tabs"><button data-t="char" class="on">ตัวละคร</button><button data-t="up">อัพเกรดถาวร</button></div>
    <div id="mbody"></div>
    <div class="bot"><div id="best"></div><button id="play" class="big">▶ เริ่มเล่น</button></div>
  </div>

  <div id="codex" class="scr bgm hidden">
    <div class="top"><button class="back" data-back="1">◀</button><div class="title">📖 ดัชนีสกิล</div></div>
    <div class="tabs" id="cdxtabs"></div>
    <div id="cbody"><div class="cx scroll" id="cx"></div></div>
  </div>

  <div id="setg" class="scr bgm hidden">
    <div class="top"><button class="back" data-back="1">◀</button><div class="title">⚙ ตั้งค่า</div></div>
    <div class="setrows" id="setrows"></div>
  </div>

  <div id="lvl" class="scr ov hidden"><h1 id="lvh">เลเวลอัพ</h1><div class="rw hidden" id="rw"></div><div class="cards" id="cards"></div></div>
  <div id="pause" class="scr ov hidden"><h1>พักเกม</h1><div class="chips" id="pbn" style="max-width:760px"></div><div class="btnrow"><button class="btn" id="resume">▶ เล่นต่อ</button><button class="btn g" id="quit">ออกจากด่าน</button></div></div>
  <div id="win" class="scr ov hidden"><h1>🏆 ผ่านครบ 100 เวฟ!</h1><div class="rs">คุณคือนักล่าราตรีตัวจริง!<br>โบนัสชนะเกม <b>💰 +2000</b></div><div class="btnrow"><button class="btn" id="wcont">เล่นต่อ (ไม่จำกัดเวฟ)</button><button class="btn g" id="wend">จบเกม รับรางวัล</button></div></div>
  <div id="over" class="scr ov hidden"><h1 id="ovt">จบเกม</h1><div class="rs" id="ovb"></div><button class="btn" id="back">กลับเมนู</button></div>
</div>
<script>
'use strict';
/* ================= พื้นฐาน ================= */
const VW=960,VH=540,WORLD=2600,GROUND=470,WAVE_LEN=25,MAX_WAVE=100,CHEST_EVERY=30;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const FONT='"Noto Sans Thai","Sarabun","Tahoma",sans-serif';
let SC=1,PR=1;
function resize(){
  const w=innerWidth,h=innerHeight;SC=Math.min(w/VW,h/VH);
  $('stage').style.transform=`translate(${(w-VW*SC)/2}px,${(h-VH*SC)/2}px) scale(${SC})`;
  PR=Math.min(2.5,(window.devicePixelRatio||1)*SC);cv.width=Math.round(VW*PR);cv.height=Math.round(VH*PR);
}
addEventListener('resize',resize);resize();
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= เซฟ ================= */
const KEY='nightHunter_v1';
const DEFAULT_S=()=>({gold:0,owned:['knight'],sel:'knight',up:{},best:0,snd:true,dmgnum:true,minimap:true,shake:true});
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S=Object.assign(DEFAULT_S(),S);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ================= เสียง ================= */
let AC=null;const lastSfx={};
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(f,d=.08,type='square',v=.04,slide=0,key){
  if(!S.snd||!AC)return;key=key||f;const now=AC.currentTime;
  if(lastSfx[key]&&now-lastSfx[key]<.05)return;lastSfx[key]=now;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),now+d);
  g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);
  o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+d);
}

/* ================= ระดับความหายาก ================= */
const TIER=[{n:'คอมมอน',c:'#f2f2f2'},{n:'นอร์มอล',c:'#4de08a'},{n:'อีปิค',c:'#b66bff'},{n:'โกลด์',c:'#ffd23f'},{n:'ตำนาน',c:'#ff4d4d'}];
const tierOfWave=w=>w>100?5:Math.min(5,Math.max(1,Math.ceil(w/20)));

/* ================= ตัวละคร ================= */
const CHARS={
  knight:{name:'อัศวินเหล็ก',price:0,hp:120,spd:230,armor:1,mod:{},color:'#5b78c8',pants:'#33405e',hat:'helmet',base:'k_slash',sig:'k_wave',
    trait:'เกราะ +1 เลือดอึด',desc:'นักรบแนวหน้า อึด ถึก ฟันกวาดรอบตัว'},
  archer:{name:'นักธนูป่า',price:300,hp:90,spd:250,armor:0,mod:{proj:.15},color:'#3f9e5a',pants:'#5a4630',hat:'hood',base:'a_arrow',sig:'a_rain',
    trait:'ความเร็วกระสุน +15%',desc:'ยิงไกล แม่นยำ ถนัดเก็บศัตรูจากระยะไกล'},
  mage:{name:'จอมเวทดารา',price:800,hp:80,spd:230,armor:0,mod:{area:.15},color:'#8a4fd6',pants:'#3a2a66',hat:'wizard',base:'m_fire',sig:'m_ice',
    trait:'ความกว้างโจมตี +15%',desc:'ระเบิดวงกว้าง เลือดน้อยแต่ทำดาเมจแรง'},
  ninja:{name:'นินจาเงา',price:1500,hp:90,spd:290,armor:0,mod:{jump:.12},color:'#2b2b3a',pants:'#1b1b26',hat:'mask',base:'n_star',sig:'n_bomb',
    trait:'เดินไว กระโดดสูง +12%',desc:'ว่องไว ขว้างชูริเคนกลับมาเป็นบูมเมอแรง'},
  gunner:{name:'พลปืนเหล็ก',price:2500,hp:100,spd:240,armor:0,mod:{might:.1},color:'#d98a2b',pants:'#4a3a28',hat:'cap',base:'g_gun',sig:'g_rocket',
    trait:'พลังโจมตี +10%',desc:'กระสุนรัวถี่ ยิงชุดต่อเนื่อง พลังโจมตีสูง'}
};
const CHAR_ORDER=['knight','archer','mage','ninja','gunner'];

/* ================= สกิล ================= */
const D=p=>['ดาเมจ +'+p+'%',s=>s.dmg*=1+p/100];
const CD=p=>['คูลดาวน์ -'+p+'%',s=>s.cd*=1-p/100];
const AM=n=>['จำนวน +'+n,s=>s.amt+=n];
const AR=p=>['ความกว้าง +'+p+'%',s=>s.area*=1+p/100];
const FXS=()=>['เอฟเฟกต์อลังการขึ้น (แสง/ประกาย)',s=>s.fx+=1];
const FIN=['ร่างสมบูรณ์: จำนวน +2 ใหญ่ขึ้น เอฟเฟกต์สุดอลังการ',s=>{s.amt+=2;s.fx+=2;s.area*=1.2;s.dmg*=1.25}];
const STP={
  proj:()=>[D(20),AM(1),AR(20),FXS(),AM(1),CD(15),FIN],
  melee:()=>[D(20),AR(20),['ฟันทั้งสองด้าน',s=>s.both=1],FXS(),AM(1),CD(15),FIN],
  orbit:()=>[AM(1),D(25),FXS(),AM(1),D(30),AM(1),['ร่างสมบูรณ์: ใบมีด +2 ใหญ่ขึ้น เอฟเฟกต์สุดอลังการ',s=>{s.amt+=2;s.fx+=2;s.dmg*=1.3;s.area*=1.15}]],
  aura:()=>[AR(20),D(30),FXS(),CD(15),AR(25),D(40),['ร่างสมบูรณ์: วงกว้างมาก เอฟเฟกต์สุดอลังการ',s=>{s.area*=1.3;s.fx+=2;s.dmg*=1.3}]],
  strike:()=>[AM(1),D(25),AR(25),FXS(),AM(1),CD(15),FIN],
  drone:()=>[AM(1),D(25),CD(15),FXS(),AM(1),D(30),['ร่างสมบูรณ์: จำนวน +2 ยิงถี่ขึ้น เอฟเฟกต์อลังการ',s=>{s.amt+=2;s.cd*=.8;s.fx+=2}]]
};
const W={};
function def(id,o){o.id=id;o.max=8;W[id]=o}
/* --- สกิลประจำตัวตัวละคร (เริ่มต้น + ประจำตัว) --- */
def('k_slash',{own:'knight',base_:1,name:'ฟันดาบ',icon:'⚔️',kind:'slash',desc:'ฟันดาบกวาดไปด้านหน้า',base:{dmg:14,cd:1.0,amt:1},steps:STP.melee()});
def('k_wave',{own:'knight',sig:1,name:'คลื่นกระแทก',icon:'🌊',kind:'ground',desc:'ปล่อยคลื่นพลังวิ่งไปตามพื้นทั้งสองด้าน',base:{dmg:16,cd:3.2,amt:1,r:26,v:330,life:1.1},steps:STP.proj()});

function later(d,f){if(d<=0)f();else TM.push({t:d,f})}
function canHit(e,key,cd){const t=e.hc[key];if(t!==undefined&&G.time-t<cd)return false;e.hc[key]=G.time;return true}
function nearest(x,y,maxD){let b=null,bd=maxD;for(const e of E){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<bd){bd=d;b=e}}return b}
function aim(range){const e=nearest(p.x,p.y-24,range);if(!e)return null;return{e,an:Math.atan2(e.y-(p.y-24),e.x-p.x)}}
function shot(o){
  const q=Object.assign({x:0,y:0,vx:0,vy:0,r:8,dmg:10,pierce:0,life:2,grav:0,rot:0,vr:0,col:'#fff',shape:'orb',age:0,hitCd:1e9,uid:++UID,fx:0},o);

function txt(x,y,t,col){if(!S.dmgnum||TXT.length>40)return;TXT.push({x:x+rnd(-8,8),y,t,col,life:.7})}
function part(x,y,n,col,sp=160,life=.5,size=3){for(let i=0;i<n&&PART.length<420;i++){const a=rnd(0,7),v=rnd(.2,1)*sp;PART.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:life*rnd(.6,1),l0:life,col,size:size*rnd(.6,1.2)})}}
function visEnemies(){return E.filter(e=>!e.dead&&e.x>cam.x-20&&e.x<cam.x+VW+20)}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l2;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}

function hurt(e,dmg,o={}){
  if(e.dead)return;
  const crit=Math.random()<p.crit;if(crit)dmg*=2;
  e.hp-=dmg;e.flash=.09;
  if(o.kb&&!e.boss)e.kx=clamp(e.kx+o.kb,-260,260);
  if(o.slow)e.slow=Math.max(e.slow,o.slow);
  if(p.ls>0){const h=Math.min(dmg*p.ls,p.lsTok);p.lsTok-=h;p.hp=Math.min(p.maxhp,p.hp+h)}
  txt(e.x,e.y-e.r,Math.round(dmg),crit?'#ffd34d':'#fff');
  sfx(170,.05,'square',.025,0,'hit');
  if(e.hp<=0)kill(e);
}
function aoe(x,y,r,dmg,o={}){
  for(const e of E){if(e.dead)continue;const dx=e.x-x,dy=e.y-y;if(dx*dx+dy*dy<(r+e.r)**2)hurt(e,dmg,{kb:Math.sign(dx)*140,slow:o.slow})}
  const fx=o.fx||0;
  if(!o.noRing){FX.push({kind:'ring',x,y,r,t:0,life:.3,col:o.col||'#ffb347'});if(fx>=2)FX.push({kind:'ring',x,y,r:r*1.3,t:-.08,life:.35,col:'#fff'})}
  part(x,y,10+fx*7,o.col||'#ffb347',200+fx*40,.4+fx*.08,3+fx*.4);
  if(S.shake)cam.shake=Math.max(cam.shake,o.shake===undefined?3:o.shake);

}
function dropGem(x,y,v){

}
function kill(e){

  }
}

const UPD={
  orbit(i,s,dt){
    i.ang=(i.ang||0)+dt*(s.spin||3.2)*s.spd;const R=(s.R||76)*p.reachM;i.blades=[];
    for(let k=0;k<s.amt;k++){

      if(s.fx&&Math.random()<.2*s.fx)part(bx,by,1,s.col,30,.3,3);
      for(const e of E){if(e.dead)continue;const dx=e.x-bx,dy=e.y-by,rr=e.r+(s.size||14)*s.area;
        if(dx*dx+dy*dy<rr*rr&&canHit(e,'o'+i.n+'_'+k,s.cd))hurt(e,s.dmg,{kb:Math.sign(dx)*100})}
    }
  },
  aura(i,s,dt){
    i.t-=dt;const R=(s.R||90)*s.area;
    if(s.pull)for(const e of E){if(e.dead||e.boss)continue;const dx=p.x-e.x,dy=p.y-22-e.y,d=Math.hypot(dx,dy);if(d<R*1.5&&d>24){e.x+=dx/d*s.pull*dt;if(e.kind==='fly')e.y+=dy/d*s.pull*dt}}

  s.dmg*=p.might;s.cd*=p.cdm;s.area*=p.areaM;s.spd*=p.projSpd;if(!d.noAmt)s.amt+=p.amountB;

function recalc(first){
  const ch=CHARS[p.char],u=k=>S.up[k]||0,b=p.b,m=ch.mod;
  p.might=1+.05*u('might')+b.might+(m.might||0);
  p.armorV=(ch.armor||0)+u('armor')+b.armor;
  const old=p.maxhp||0;p.maxhp=Math.round(ch.hp+10*u('hp')+b.hp);p.hp=first?p.maxhp:Math.min(p.maxhp,p.hp+Math.max(0,p.maxhp-old));
  p.regen=.15*u('regen')+b.regen;
  p.cdm=Math.max(.3,1-.025*u('cd')-b.cd);
  p.areaM=1+.06*u('width')+b.width+(m.area||0);
  p.reachM=1+.06*u('reach')+b.reach;
  p.projSpd=1+.05*u('proj')+b.proj+(m.proj||0);
  p.speed=ch.spd*(1+.05*u('spd')+b.spd);
  p.magnet=1+.1*u('mag')+b.mag;
  p.growth=1+.05*u('grow')+b.grow;
  p.greed=1+.05*u('greed')+b.greed;
  p.amountB=u('amt');
  p.crit=.05+.03*u('luck')+b.luck;
  p.jumpM=1+.04*u('jump')+b.jump+(m.jump||0);
  p.ls=.004*u('ls')+b.ls;
}
const xpNeed=l=>Math.round(5+(l-1)*7+Math.pow(l-1,1.35));

  recalc(true);p.lsTok=p.maxhp*.05;
  E=[];P=[];GEM=[];COIN=[];HRT=[];CH=[];PART=[];TXT=[];FX=[];TM=[];
  G={state:'play',time:0,wave:1,waveT:0,spawnT:1,chestT:0,kills:0,gold:0,xp:0,lvl:1,need:xpNeed(1),pending:0,banner:{txt:'เวฟ 1',t:2.2},opts:[],note:null,won:0,mode:'lvl'};
  cam.x=clamp(p.x-VW/2,0,WORLD-VW);

}
function endRun(){
  const bonus=G.wave*8,total=Math.round(G.gold+bonus);
  S.gold+=total;S.best=Math.max(S.best,G.wave);persist();
  G.state='over';$('touch').classList.add('hidden');
  const m=Math.floor(G.time/60),s=Math.floor(G.time%60);
  $('ovb').innerHTML=`เวฟที่ไปถึง: <b>${G.wave}</b><br>เวลารอด: <b>${m}:${String(s).padStart(2,'0')}</b><br>สังหารมอนสเตอร์: <b>${G.kills}</b><br>เลเวล: <b>${G.lvl}</b><br>เหรียญที่เก็บได้: <b>💰 ${Math.round(G.gold)}</b> + โบนัสเวฟ <b>${bonus}</b><br>รวมได้รับ: <b>💰 ${total}</b>`;
  $('ovt').textContent=G.quit?'ออกจากด่าน':(G.won?'🏆 จบเกมอย่างยิ่งใหญ่':'คุณพ่ายแพ้…');

}

function pickType(){
  const w=G.wave,t=[['zombie',10],['bat',w>=2?7:0],['skeleton',w>=3?6:0],['slime',w>=5?5:0],['ghost',w>=8?4:0],['brute',w>=12?Math.min(10,(w-10)*.8):0]];
  let sum=0;t.forEach(a=>sum+=a[1]);let r=Math.random()*sum;for(const a of t){if((r-=a[1])<=0)return a[0]}return'zombie';
}
function mkEnemy(type,x,y){
  const d=EN[type],w=G.wave;
  const hpM=1+.12*(w-1)+.0035*(w-1)*(w-1),dmgM=1+.04*(w-1),spdM=Math.min(1.4,1+.01*(w-1));
  const e={type,x,y,vx:0,vy:0,r:d.r,hp:d.hp*hpM,spd:d.spd*spdM*rnd(.9,1.1),dmg:d.dmg*dmgM,xp:d.xp*(1+.08*(w-1)),kind:d.kind,boss:!!d.boss,ghost:d.ghost,slow:0,flash:0,kx:0,t:rnd(0,6),jcd:rnd(0,2),hc:{},on:false,dead:false,charge:0,cdT:rnd(2,4),face:1};
  if(d.boss){const idx=Math.max(0,Math.round(w/5)-1);e.name=BOSS_NAMES[idx%20]+(w>100?' Ω':'');e.bc='hsl('+((idx*47+350)%360)+',55%,30%)';e.tier=tierOfWave(w)}
  e.max=e.hp;E.push(e);return e;
}
function spawnAt(type){
  let side=Math.random()<.5?-1:1;let x=side<0?cam.x-40:cam.x+VW+40;
  if(x<10||x>WORLD-10){side=-side;x=side<0?cam.x-40:cam.x+VW+40}
  x=clamp(x,10,WORLD-10);
  const d=EN[type];return mkEnemy(type,x,d.kind==='fly'?rnd(80,340):GROUND-d.r);
}
function spawnEnemy(){if(E.length>=Math.min(150,50+G.wave*3))return;spawnAt(pickType())}
function spawnBurst(){const n=Math.min(30,4+Math.floor(G.wave*.6));for(let i=0;i<n;i++)spawnEnemy()}
function spawnBoss(){const e=spawnAt('boss');G.banner={txt:'⚠ '+e.name+' ⚠',t:3};sfx(70,.6,'sawtooth',.08,-20,'bs')}
function waveStart(){G.banner={txt:'เวฟ '+G.wave,t:2.2};spawnBurst();if(G.wave%5===0)spawnBoss();sfx(260,.3,'triangle',.06,200,'wv2')}
function spawnChest(tier,x,y){CH.push({x,y,tier,t:Math.random()*6,id:++UID})}
function spawnChestRandom(){
  const t=tierOfWave(G.wave);let x,y;
  for(let k=0;k<10;k++){
    if(Math.random()<.5){const pl=PLAT[Math.floor(Math.random()*PLAT.length)];x=pl.x+rnd(20,pl.w-20);y=pl.y}else{x=rnd(80,WORLD-80);y=GROUND}

function openChest(c){
  CH.splice(CH.indexOf(c),1);
  const t=c.tier,mult=CB_MULT[t-1];
  const gold=Math.round(CB_GOLD[t-1]*(1+G.wave*.03)*p.greed);G.gold+=gold;
  const lines=[];
  shuffle(Object.keys(CB)).slice(0,CB_N[t-1]).forEach(k=>{const amt=CB[k].u*mult;p.b[k]+=amt;lines.push(CB[k].i+' '+CB[k].n+' '+CB[k].f(amt))});

  sfx(900,.4,'triangle',.07,900,'chop');

function groundPhys(o,h,wasFeet){
  const feet=o.y+h;let on=false;
  if(feet>=GROUND){o.y=GROUND-h;o.vy=0;on=true}
  else if(o.vy>=0){for(const pl of PLAT){if(o.x>pl.x-4&&o.x<pl.x+pl.w+4&&wasFeet<=pl.y+3&&feet>=pl.y){o.y=pl.y-h;o.vy=0;on=true;break}}}
  return on;
}
function updPlayer(dt){
  const ax=K.jx||((K.r?1:0)-(K.l?1:0));
  p.vx+=(ax*p.speed-p.vx)*Math.min(1,dt*(ax?16:12));
  if(Math.abs(ax)>.1){p.face=ax>0?1:-1;p.walk+=dt}
  if(K.j&&!p.jh)p.jb=.12;
  if(!K.j&&p.jh&&p.vy<0)p.vy*=.5;
  p.jh=K.j;
  p.coy-=dt;p.jb-=dt;if(p.on)p.coy=.1;
  if(p.jb>0&&p.coy>0){p.vy=-700*p.jumpM;p.on=false;p.coy=0;p.jb=0;sfx(330,.12,'square',.03,300,'jp')}
  const wf=p.y;p.vy+=1700*dt;p.y+=p.vy*dt;p.x=clamp(p.x+p.vx*dt,16,WORLD-16);
  p.on=groundPhys(p,0,wf);
  if(p.regen>0)p.hp=Math.min(p.maxhp,p.hp+p.regen*dt);
  p.lsTok=Math.min(p.maxhp*.05,p.lsTok+p.maxhp*.03*dt);
  p.inv-=dt;p.flash-=dt;
  for(const i of p.wp){const d=W[i.id],s=wstats(i);
    if(UPD[d.kind])UPD[d.kind](i,s,dt);
    else{i.t-=dt;if(i.t<=0){const r=FIRE[d.kind](i,s);i.t=r===false?.12:s.cd}}}
}
function updEnemies(dt){
  const pc=p.y-22;
  for(const e of E){
    if(e.dead)continue;
    e.t+=dt;e.flash-=dt;e.slow-=dt;e.jcd-=dt;
    const sm=e.slow>0?.5:1,dx=p.x-e.x,dir=dx>0?1:-1;
    e.face=dir;
    if(e.kind==='fly'){
      const dy=pc-e.y,d=Math.hypot(dx,dy)||1;
      e.x+=(dx/d*e.spd*sm+e.kx)*dt;e.y+=(dy/d*e.spd*sm+Math.sin(e.t*5)*40)*dt;
    }else{
      let vx=dir*e.spd*sm;
      if(e.boss){e.cdT-=dt;if(e.cdT<=0){e.charge=.9;e.cdT=rnd(4,6)}if(e.charge>0){e.charge-=dt;vx*=2}}
      const wf=e.y+e.r,above=p.y<wf-45&&Math.abs(dx)<520;
      if(e.kind==='hop'){
        if(e.on){e.vx=0;if(e.jcd<=0){e.vy=above?-740:-460;e.vx=dir*e.spd*2.6;e.jcd=rnd(.7,1.3);e.on=false}}
        vx=e.vx;
      }else if(e.on&&e.jcd<=0&&above){e.vy=e.boss?-820:-740;e.jcd=e.boss?1.6:rnd(.9,1.4)}
      e.vy+=1700*dt;e.y+=e.vy*dt;e.x+=(vx*(e.kind==='hop'&&!e.on?sm:1)+e.kx)*dt;
      e.on=groundPhys(e,e.r,wf);
    }
    e.kx*=Math.pow(.01,dt);e.x=clamp(e.x,-60,WORLD+60);
    if(p.inv<=0){const ddx=e.x-p.x,ddy=e.y-pc,rr=e.r+13;if(ddx*ddx+ddy*ddy<rr*rr)hitPlayer(e.dmg)}
  }
  for(let i=0;i<E.length;i++){const a=E[i];if(a.dead||a.boss)continue;
    for(let j=i+1;j<E.length;j++){const b=E[j];if(b.dead||b.boss)continue;const dx=b.x-a.x;if(dx>14||dx<-14)continue;const dy=b.y-a.y;if(dy>14||dy<-14)continue;
      const s=(dx>=0?1:-1)*40*.016;a.x-=s;b.x+=s}}
  if(E.some(e=>e.dead))E=E.filter(e=>!e.dead);
}
function hitPlayer(d){

  p.hp-=dmg;p.inv=.7;p.flash=.15;if(S.shake)cam.shake=Math.max(cam.shake,5);txt(p.x,p.y-50,'-'+dmg,'#ff5a5a');part(p.x,p.y-22,8,'#ff4d4d',200,.4);sfx(120,.2,'sawtooth',.06,-60,'pl');
  if(p.hp<=0){

    else{p.hp=0;endRun()}

}
function updProj(dt){
  for(const q of P){
    q.age+=dt;q.life-=dt;
    if(q.follow){q.x=p.x+q.ox;q.y=p.y-22+q.oy}
    else{
      if(q.home){const t=nearest(q.x,q.y,650);if(t){const sp=Math.hypot(q.vx,q.vy)||q.sp,ta=Math.atan2(t.y-q.y,t.x-q.x),ca=Math.atan2(q.vy,q.vx);let da=ta-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;const k=Math.min(1,dt*(q.home*6)),na=ca+da*k;q.vx=Math.cos(na)*sp;q.vy=Math.sin(na)*sp}}
      if(q.accel){const sp=Math.hypot(q.vx,q.vy)||1,ns=Math.min(sp+q.accel*dt,620),k=ns/sp;q.vx*=k;q.vy*=k}
      if(q.boom!==undefined&&q.age>q.boom){const tx=p.x-q.x,ty=p.y-22-q.y,d=Math.hypot(tx,ty)||1;q.vx=tx/d*q.sp*1.15;q.vy=ty/d*q.sp*1.15;if(d<24)q.life=0}
      q.vy+=q.grav*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
      if(q.gb){const l=cam.x+8,r=cam.x+VW-8;if(q.x<l){q.x=l;q.vx=Math.abs(q.vx)}if(q.x>r){q.x=r;q.vx=-Math.abs(q.vx)}
        if(q.y>GROUND-q.r&&q.vy>0){q.y=GROUND-q.r;q.vy=-Math.max(430,Math.abs(q.vy)*.92);aoe(q.x,GROUND-10,q.bAoe,q.dmg*.6,{col:'#c9a37a',shake:1.5,fx:q.fx})}}
      if(q.landAoe&&q.y>=GROUND-8&&q.age>.15){aoe(q.x,GROUND-10,q.landAoe,q.dmg*.7,{col:'#ffcf8a',shake:2,fx:q.fx});q.life=0}
      if(q.killGround&&q.y>GROUND)q.life=0;
      if(q.killBelow&&q.y>VH+60)q.life=0;
      if(q.x<-150||q.x>WORLD+150||q.y<-200||q.y>VH+200)q.life=0;
    }
    q.rot+=q.vr*dt;
    if(q.fx&&Math.random()<.35*q.fx)part(q.x,q.y,1,q.col,30,.3,2+q.fx*.5);
    if(!q.noHit&&q.life>0){
      for(const e of E){
        if(e.dead)continue;const dx=e.x-q.x,dy=e.y-q.y,rr=e.r+q.r;
        if(dx*dx+dy*dy<rr*rr){
          if(q.expl){aoe(q.x,q.y,q.expl,q.dmg,{slow:q.slow,col:q.col,fx:q.fx});q.exploded=1;q.life=0;break}
          if(!canHit(e,q.uid,q.hitCd))continue;
          hurt(e,q.dmg,{kb:Math.sign(q.vx||dx)*(q.kb===undefined?70:q.kb),slow:q.slow});
          if(q.pierce--<=0){q.life=0;break}
        }
      }
    }
    if(q.life<=0&&q.expl&&!q.exploded){q.exploded=1;aoe(q.x,q.y,q.expl,q.dmg,{slow:q.slow,col:q.col,fx:q.fx})}
  }
  P=P.filter(q=>q.life>0);
}
function updPickups(dt){
  const mr=70*p.magnet,pc=p.y-18;
  const doList=(L,fn)=>{for(let i=L.length-1;i>=0;i--){const g=L[i];
    if(!g.att){g.vy=(g.vy||0)+900*dt;g.y+=g.vy*dt;if(g.y>GROUND-6){g.y=GROUND-6;g.vy=0}}
    const dx=p.x-g.x,dy=pc-g.y,d=Math.hypot(dx,dy);
    if(d<mr)g.att=1;
    if(g.att){g.sp=(g.sp||200)+900*dt;g.x+=dx/(d||1)*g.sp*dt;g.y+=dy/(d||1)*g.sp*dt}
    if(d<20){fn(g);L.splice(i,1)}}};
  doList(GEM,g=>{G.xp+=g.v*p.growth;sfx(700+Math.min(500,g.v*40),.05,'sine',.025,200,'gm')});
  doList(COIN,g=>{G.gold+=g.v*p.greed;sfx(1100,.07,'square',.025,500,'cn')});
  doList(HRT,g=>{p.hp=Math.min(p.maxhp,p.hp+p.maxhp*.25);txt(p.x,p.y-50,'+เลือด','#7dff9a');sfx(500,.2,'sine',.05,400,'hr')});
  while(G.xp>=G.need){G.xp-=G.need;G.lvl++;G.need=xpNeed(G.lvl);G.pending++}

function updChests(dt){
  G.chestT+=dt;if(G.chestT>=CHEST_EVERY){G.chestT-=CHEST_EVERY;spawnChestRandom()}
  for(const c of CH){c.t+=dt;if(Math.random()<.04)part(c.x+rnd(-14,14),c.y-rnd(4,26),1,TIER[c.tier-1].c,30,.7,2.5);
    if(Math.hypot(p.x-c.x,(p.y-22)-(c.y-12))<36){openChest(c);return}}

function updMisc(dt){
  for(let i=TM.length-1;i>=0;i--){const t=TM[i];t.t-=dt;if(t.t<=0){TM.splice(i,1);t.f()}}
  for(const q of PART){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt}

function update(dt){
  G.time+=dt;G.waveT+=dt;
  if(G.waveT>=WAVE_LEN){
    G.wave++;G.waveT=0;
    if(G.wave===MAX_WAVE+1&&!G.won){G.won=1;G.gold+=2000;G.state='win';K.l=K.r=K.j=K.jx=0;$('win').classList.remove('hidden');sfx(600,.8,'triangle',.07,900,'win');return}
    waveStart();
  }
  G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=Math.max(.22,1.2-.02*G.wave);const n=1+Math.floor(G.wave/6);for(let i=0;i<n;i++)spawnEnemy()}

  updEnemies(dt);updProj(dt);updPickups(dt);updMisc(dt);updChests(dt);
  if(G.state!=='play')return;
  const tx=clamp(p.x-VW/2+p.face*40,0,WORLD-VW);cam.x+=(tx-cam.x)*Math.min(1,dt*6);
  if(G.pending>0&&G.state==='play'){G.mode='lvl';G.opts=rollOptions();showCards()}
}

/* ================= ตัวเลือกสกิล (เลเวลอัพ / กล่อง) ================= */
const ownedInst=id=>p.wp.find(i=>i.id===id);
const usable=d=>!d.own||d.own===p.char;
function skillOpt(id,wt){
  const d=W[id],inst=ownedInst(id);
  if(inst)return inst.lvl<d.max?{kind:'w',id,lvl:inst.lvl,w:wt*1.4}:null;
  return p.wp.length<6?{kind:'w',id,lvl:0,w:wt}:null;
}
function rollOptions(){
  const pool=[];
  for(const id in W){const d=W[id];if(!usable(d))continue;
    if(!(d.own||d.tier<=2||ownedInst(id)))continue;
    const o=skillOpt(id,d.sig?1.8:1);if(o)pool.push(o)}
  const out=[];
  while(out.length<3&&pool.length){let sum=0;pool.forEach(o=>sum+=o.w);let r=Math.random()*sum,k=0;for(;k<pool.length;k++){if((r-=pool[k].w)<=0)break}k=Math.min(k,pool.length-1);out.push(pool.splice(k,1)[0])}
  return fillOpts(out);
}
function chestOptions(t){
  const out=[];
  for(let tt=t;tt>=1&&out.length<3;tt--){
    shuffle(SHARED.filter(id=>W[id].tier===tt)).forEach(id=>{if(out.length<3){const o=skillOpt(id,1);if(o)out.push(o)}});
  }
  shuffle(Object.keys(W).filter(id=>W[id].own===p.char)).forEach(id=>{if(out.length<3){const o=skillOpt(id,1);if(o&&!out.some(x=>x.id===id))out.push(o)}});
  return fillOpts(out);
}
function fillOpts(out){const fill=[{kind:'heal'},{kind:'gold'}];while(out.length<3)out.push(fill[out.length%2]);return out}
function choose(i){
  if(G.state!=='levelup')return;const o=G.opts[i];if(!o)return;
  if(o.kind==='w'){const inst=ownedInst(o.id);if(inst)inst.lvl++;else p.wp.push({id:o.id,lvl:1,t:.2,n:++UID})}
  else if(o.kind==='heal')p.hp=Math.min(p.maxhp,p.hp+p.maxhp*.3);
  else G.gold+=50;
  if(G.mode==='lvl')G.pending--;
  $('lvl').classList.add('hidden');G.state='play';
  p.inv=Math.max(p.inv,.6);
  if(G.pending>0){G.mode='lvl';G.opts=rollOptions();showCards()}
}

    drawBar(e.x-60,e.y-e.r-34,120,7,e.hp/e.max,'#d22');c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(e.x-60,e.y-e.r-34,120,7);c.textAlign='left'}
  for(const i of p.wp){const d=W[i.id];if(DRW[d.kind])DRW[d.kind](i,wstats(i))}
  if(!(p.inv>0&&Math.floor(G.time*24)%2)){if(p.flash>0)c.globalAlpha=.6;drawHeroCtx(c,p.char,p.x,p.y,p.face,p.walk,Math.abs(p.vx)>30,!p.on);c.globalAlpha=1}
  drawBar(p.x-15,p.y+5,30,4,p.hp/p.maxhp,'#e23b4a');
  for(const q of P)drawProj(q);
  for(const f of FX){const k=Math.max(0,f.t)/f.life;if(f.t<0)continue;
    if(f.kind==='ring'){c.strokeStyle=f.col;c.globalAlpha=1-k;c.lineWidth=6*(1-k)+1;c.beginPath();c.arc(f.x,f.y,f.r*(.4+.6*k),0,7);c.stroke();c.globalAlpha=1}
    else if(f.kind==='bolt'){c.strokeStyle='#fffbb0';c.shadowColor='#ff0';c.shadowBlur=18;c.lineWidth=4*(1-k)+1;c.beginPath();let y=-10,x=f.x+rnd(-25,25);c.moveTo(x,y);while(y<f.y){y+=34;x=f.x+rnd(-14,14);c.lineTo(x,Math.min(y,f.y))}c.lineTo(f.x,f.y);c.stroke();c.shadowBlur=0}
    else if(f.kind==='pillar'){const w=f.R*.55*(1-k*.4);const g=c.createLinearGradient(f.x-w,0,f.x+w,0);g.addColorStop(0,'rgba(255,240,150,0)');g.addColorStop(.5,'rgba(255,255,230,'+(1-k)+')');g.addColorStop(1,'rgba(255,240,150,0)');c.fillStyle=g;c.fillRect(f.x-w,0,w*2,f.y+10)}
    else if(f.kind==='meteor'){c.strokeStyle='rgba(255,120,40,'+(.3+.5*k)+')';c.lineWidth=3;c.setLineDash([6,5]);c.beginPath();c.arc(f.x,f.y,f.R*(1-k*.3),0,7);c.stroke();c.setLineDash([]);
      const px=f.x-160*(1-k),py=f.y-420*(1-k);c.fillStyle='#ff9a3a';c.shadowColor='#f50';c.shadowBlur=22;circ(px,py,13);c.fillStyle='#ffd24a';circ(px,py,7);c.shadowBlur=0}
    else if(f.kind==='beam'){c.globalAlpha=1-k;c.strokeStyle=f.col;c.shadowColor=f.col;c.shadowBlur=22;c.lineWidth=f.w*(1-k*.6);c.lineCap='round';c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x2,f.y2);c.stroke();c.strokeStyle='#fff';c.lineWidth=f.w*.35*(1-k);c.stroke();c.shadowBlur=0;c.globalAlpha=1;c.lineCap='butt'}}
  for(const q of PART){c.globalAlpha=clamp(q.life/q.l0,0,1);c.fillStyle=q.col;c.fillRect(q.x,q.y,q.size,q.size)}c.globalAlpha=1;
  c.font=`bold 15px ${FONT}`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.8)';
  for(const t of TXT){c.globalAlpha=clamp(t.life*2,0,1);c.strokeText(t.t,t.x,t.y);c.fillStyle=t.col;c.fillText(t.t,t.x,t.y)}c.globalAlpha=1;c.textAlign='left';
  c.restore();
  if(p.hp<p.maxhp*.3){c.fillStyle='rgba(255,0,0,'+(.1+.08*Math.sin(G.time*8))+')';c.fillRect(0,0,VW,VH)}
  hud();
}

/* ================= ลูป ================= */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(G.state==='play'){update(dt);if(p&&(G.state==='play'||G.state==='levelup'||G.state==='over'||G.state==='win'))render()}
  else if(G.state==='levelup'||G.state==='pause'||G.state==='over'||G.state==='win'){render()}
  else if(G.state==='menu'){c.setTransform(PR,0,0,PR,0,0);G.time+=dt;cam.x=0;cam.sx=cam.sy=0;bgDraw();c.save();worldDraw();c.restore()}
}
requestAnimationFrame(loop);

/* ================= ควบคุม ================= */
const keymap={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j'};
addEventListener('keydown',e=>{
  audio();const k=keymap[e.key];if(k){K[k]=1;e.preventDefault()}
  if(e.key==='Escape'||e.key==='p'||e.key==='P')window.onBack();
  if(G.state==='levelup'&&'123'.includes(e.key)&&e.key)choose(+e.key-1);
});
addEventListener('keyup',e=>{const k=keymap[e.key];if(k)K[k]=0});
/* จอยสติ๊กเลื่อนได้เฉพาะซ้าย-ขวา */
const joy=$('joy'),knob=$('knob');let joyId=null;
function joyMove(e){
  const r=joy.getBoundingClientRect(),nx=clamp(((e.clientX-r.left)/r.width)*2-1,-1,1);
  const W_=236,half=(W_-62)/2;knob.style.left=(W_/2-31+nx*half)+'px';
  const a=Math.abs(nx);K.jx=a<.12?0:Math.sign(nx)*clamp((a-.12)/.55,0,1);
}
function resetJoy(){joyId=null;K.jx=0;knob.style.left='84px'}
joy.addEventListener('pointerdown',e=>{audio();joyId=e.pointerId;joy.setPointerCapture&&joy.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,e=>{if(e.pointerId===joyId||ev==='lostpointercapture')resetJoy()}));
const bj=$('bj');
bj.addEventListener('pointerdown',e=>{audio();K.j=1;bj.classList.add('on');bj.setPointerCapture&&bj.setPointerCapture(e.pointerId);e.preventDefault()});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>bj.addEventListener(ev,()=>{K.j=0;bj.classList.remove('on')}));
function togglePause(){
  if(G.state==='play'){
    G.state='pause';K.l=K.r=K.j=0;resetJoy();
    const lines=Object.keys(CB).filter(k=>p.b[k]>0).map(k=>`<span class="chip">${CB[k].i} ${CB[k].n} ${CB[k].f(p.b[k])}</span>`);
    $('pbn').innerHTML=lines.length?'<div style="width:100%;text-align:center;color:#ffe27a;font-weight:700">🎁 โบนัสจากกล่อง (หายเมื่อจบเกม)</div>'+lines.join(''):'';
    $('pause').classList.remove('hidden');
  }else if(G.state==='pause'){G.state='play';$('pause').classList.add('hidden')}
}
$('bp').addEventListener('pointerdown',e=>{e.stopPropagation();togglePause()});
$('resume').onclick=togglePause;
$('quit').onclick=()=>{$('pause').classList.add('hidden');G.quit=1;endRun()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')togglePause()});
$('wcont').onclick=()=>{$('win').classList.add('hidden');G.state='play';waveStart()};
$('wend').onclick=()=>{$('win').classList.add('hidden');endRun()};
$('back').onclick=()=>{$('over').classList.add('hidden');G.state='menu';showScr('menu');renderMenu()};
$('cards').addEventListener('pointerdown',e=>{const el=e.target.closest('.card');if(el)choose(+el.dataset.i)});

/* ================= การ์ดเลือกสกิล ================= */
function cardHtml(o,i){
  let ic,nm,ds,tag='',lv='',col='#6f78ff',tcol='#5de08a';
  if(o.kind==='w'){const d=W[o.id];ic=d.icon;nm=d.name;
    if(d.tier){col=TIER[d.tier-1].c}else if(d.sig){col='#ff8ae6'}else col='#9fe3ff';
    if(o.lvl===0){ds=d.desc;lv='Lv.1';tag=d.sig?'สกิลประจำตัว':(d.tier?'สกิล'+TIER[d.tier-1].n+' · ใหม่!':'สกิลใหม่!');tcol=col}
    else{ds=d.steps[o.lvl-1][0];lv=`Lv.${o.lvl} → Lv.${o.lvl+1}`+(o.lvl+1===d.max?' (MAX)':'')}}
  else if(o.kind==='heal'){ic='🍗';nm='อาหารอร่อย';ds='ฟื้นเลือด 30%'}
  else{ic='💰';nm='ถุงเหรียญ';ds='ได้เหรียญทอง +50'}
  return `<div class="card" data-i="${i}" style="border-color:${col}">${tag?`<div class="tg2" style="background:${tcol}">${tag}</div>`:''}<div class="ic">${ic}</div><div class="nm">${nm}</div><div class="lv">${lv}</div><div class="ds">${ds}</div><div class="key">กด ${i+1}</div></div>`;
}
function showCards(){
  G.state='levelup';K.l=K.r=K.j=0;resetJoy();
  const chest=G.mode==='chest',T=chest?TIER[G.rew.tier-1]:null;
  $('lvh').textContent=chest?'📦 เปิดกล่อง'+T.n+'!':'⬆ เลเวลอัพ! เลือกสกิล';
  $('lvh').style.color=chest?T.c:'';
  $('rw').classList.toggle('hidden',!chest);
  if(chest)$('rw').innerHTML=`<div class="rwt">💰 ได้รับ +${G.rew.gold} เหรียญ</div><div class="chips">${G.rew.lines.map(l=>`<span class="chip">${l}</span>`).join('')}</div><div class="rwq">สถานะที่เพิ่มอยู่ถึงจบเกมเท่านั้น · เลือกสกิล 1 จาก 3</div>`;
  $('cards').innerHTML=G.opts.map(cardHtml).join('');
  $('lvl').classList.remove('hidden');sfx(500,.3,'triangle',.06,500,'lu');
}

/* ================= หน้าจอเมนู ================= */
const SCRS=['title','menu','codex','setg'];
function hideAllScr(){SCRS.forEach(x=>$(x).classList.add('hidden'));['lvl','pause','win','over'].forEach(x=>$(x).classList.add('hidden'))}
function showScr(id){SCRS.forEach(x=>$(x).classList.toggle('hidden',x!==id));$('touch').classList.add('hidden');if(id==='title')renderTitle();if(id==='codex')renderCodex();if(id==='setg')renderSet();if(id==='menu')renderMenu()}
function renderTitle(){$('tinfo').textContent='💰 '+S.gold+'   ·   เวฟสูงสุด '+S.best}
let tab='char',view=S.sel,cdxTab=1;
function renderMenu(){
  $('mgold').textContent=S.gold;$('best').textContent='เวฟสูงสุด: '+S.best;
  document.querySelectorAll('#menu .tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const mb=$('mbody');
  if(tab==='char'){
    const own=id=>S.owned.includes(id),v=CHARS[view],bw=W[v.base],sw=W[v.sig];
    mb.innerHTML=`<div class="chars">${CHAR_ORDER.map(id=>{const d=CHARS[id];return `<div class="cc ${own(id)?'':'lock'} ${id===S.sel?'sel':''} ${id===view?'view':''}" data-id="${id}"><canvas width="152" height="172" data-h="${id}"></canvas>${own(id)?'':'<div class="lk">🔒</div>'}<div>${d.name}</div>${own(id)?'':`<div class="pr">💰 ${d.price}</div>`}</div>`}).join('')}</div>
    <div class="det"><h2>${v.name}</h2><div>${v.desc}</div><div class="st">❤ เลือด ${v.hp} · 🏃 ความเร็ว ${v.spd} · ${v.trait}</div>
    <div class="sk"><b>${bw.icon} สกิลเริ่มต้น: ${bw.name}</b><br>${bw.desc}</div>
    <div class="sk sg"><b>${sw.icon} สกิลประจำตัว: ${sw.name}</b><br>${sw.desc}<br><span style="color:#aab;font-size:12px">* สุ่มมาให้เลือกตอนเลเวลอัพ เริ่มทุกรอบที่ Lv.1</span></div>
    ${own(view)?`<button class="act" id="act" ${view===S.sel?'disabled':''}>${view===S.sel?'กำลังใช้ตัวละครนี้':'เลือกตัวละครนี้'}</button>`:`<button class="act buy" id="act" ${S.gold<v.price?'disabled':''}>ซื้อ 💰 ${v.price}</button>`}</div>`;
    mb.querySelectorAll('canvas[data-h]').forEach(cn=>{const g=cn.getContext('2d');g.scale(2,2);g.translate(38,70);g.scale(1.25,1.25);drawHeroCtx(g,cn.dataset.h,0,0,1,0,false,false)});
  }else{
    mb.innerHTML=`<div class="ups scroll">${META.map(m=>{const l=S.up[m.k]||0,mx=l>=m.max,cost=metaCost(m,l);return `<div class="up"><div class="ic">${m.i}</div><div class="tx"><b>${m.n}</b> <span>${m.d}</span><div class="pips">${Array.from({length:m.max},(_,i)=>`<i class="${i<l?'f':''}"></i>`).join('')}</div></div><button data-k="${m.k}" ${mx||S.gold<cost?'disabled':''}>${mx?'MAX':'💰 '+cost}</button></div>`}).join('')}</div>`;
  }
}
$('mbody').addEventListener('click',e=>{
  audio();
  const cc=e.target.closest('.cc');if(cc){view=cc.dataset.id;if(S.owned.includes(view)){S.sel=view;persist()}renderMenu();return}
  if(e.target.id==='act'){
    if(S.owned.includes(view)){S.sel=view}
    else if(S.gold>=CHARS[view].price){S.gold-=CHARS[view].price;S.owned.push(view);S.sel=view;sfx(900,.3,'triangle',.06,600,'by')}
    persist();renderMenu();return}
  const ub=e.target.closest('button[data-k]');
  if(ub){const m=META.find(x=>x.k===ub.dataset.k),l=S.up[m.k]||0,cost=metaCost(m,l);if(l<m.max&&S.gold>=cost){S.gold-=cost;S.up[m.k]=l+1;persist();sfx(900,.2,'triangle',.06,600,'by');const sc=$('mbody').querySelector('.ups'),st=sc?sc.scrollTop:0;renderMenu();const n=$('mbody').querySelector('.ups');if(n)n.scrollTop=st}}
});
document.querySelectorAll('#menu .tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderMenu()});
$('play').onclick=()=>{view=S.sel;startRun()};

/* ---- ดัชนี ---- */
function renderCodex(){
  const tabs=[...TIER.map((t,i)=>`<button data-c="${i+1}" style="${cdxTab===i+1?`border-color:${t.c};color:${t.c}`:''}" class="${cdxTab===i+1?'on':''}">● ${t.n}</button>`),`<button data-c="0" class="${cdxTab===0?'on':''}" style="${cdxTab===0?'border-color:#9fe3ff':''}">สกิลตัวละคร</button>`];
  $('cdxtabs').innerHTML=tabs.join('');
  let html='';
  const card=(d,c_,extra)=>`<div class="cxc" style="--c:${c_}"><div class="ic">${d.icon}</div><b>${d.name}</b><div class="ds">${d.desc}</div><div class="nm">ดาเมจ ${d.base.dmg} · คูลดาวน์ ${d.base.cd}s${extra||''}</div></div>`;
  if(cdxTab>0){
    const t=TIER[cdxTab-1];html+=`<div class="cxh">ระดับ ${t.n} · ${SHARED.filter(id=>W[id].tier===cdxTab).length} สกิล · ได้จากกล่องสีนี้${cdxTab<=2?' และตอนเลเวลอัพ':''}</div>`;
    SHARED.filter(id=>W[id].tier===cdxTab).forEach(id=>{html+=card(W[id],t.c)});
  }else{
    html+=`<div class="cxh">สกิลเริ่มต้นและสกิลประจำตัวของแต่ละตัวละคร</div>`;
    CHAR_ORDER.forEach(ch=>{[CHARS[ch].base,CHARS[ch].sig].forEach(id=>{const d=W[id];html+=card(d,d.sig?'#ff8ae6':'#9fe3ff',' · '+CHARS[ch].name)})});
  }
  $('cx').innerHTML=html;$('cx').scrollTop=0;
}
$('cdxtabs').addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(b){cdxTab=+b.dataset.c;renderCodex()}});

/* ---- ตั้งค่า ---- */
let resetArm=0;
function renderSet(){
  const row=(k,t,sub)=>`<div class="srow"><div>${t}<small>${sub}</small></div><button class="tg ${S[k]?'':'off'}" data-s="${k}">${S[k]?'เปิด':'ปิด'}</button></div>`;
  $('setrows').innerHTML=row('snd','🔊 เสียงเอฟเฟกต์','เสียงโจมตี เก็บของ และเอฟเฟกต์ต่างๆ')+row('dmgnum','💢 ตัวเลขดาเมจ','แสดงตัวเลขดาเมจเหนือหัวศัตรู')+row('minimap','🗺️ มินิแมพ','แสดงแผนที่ย่อและตำแหน่งกล่องสมบัติ')+row('shake','📳 หน้าจอสั่น','จอสั่นตอนระเบิดหรือโดนตี')+
   `<button class="danger" id="resetbtn">${resetArm?'⚠ แตะอีกครั้งเพื่อยืนยันลบข้อมูลทั้งหมด':'🗑 รีเซ็ตข้อมูลเกม'}</button>`;
}
$('setrows').addEventListener('click',e=>{
  audio();const b=e.target.closest('button[data-s]');
  if(b){S[b.dataset.s]=!S[b.dataset.s];persist();sfx(700,.1,'square',.05,200,'tg');renderSet();return}
  if(e.target.id==='resetbtn'){
    if(!resetArm){resetArm=1;renderSet();setTimeout(()=>{resetArm=0;if(!$('setg').classList.contains('hidden'))renderSet()},3500)}
    else{resetArm=0;S=DEFAULT_S();persist();view=S.sel;renderSet()}
  }
});

/* ---- ไตเติล / ย้อนกลับ / ออกเกม ---- */
let exitArm=0;
$('t_start').onclick=()=>{audio();view=S.sel;showScr('menu')};
$('t_index').onclick=()=>{audio();showScr('codex')};
$('t_set').onclick=()=>{audio();showScr('setg')};
$('t_exit').onclick=()=>{
  if(!exitArm){exitArm=1;$('t_exit').textContent='⏻ แตะอีกครั้งเพื่อออก';setTimeout(()=>{exitArm=0;$('t_exit').textContent='⏻ ออกเกม'},3000);return}
  exitGame();
};
function exitGame(){
  if(window.AndroidApp&&AndroidApp.exit){AndroidApp.exit();return}
  try{window.close()}catch(e){}
  $('t_exit').textContent='ปิดแท็บเบราว์เซอร์ได้เลย';
}
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>showScr('title'));
window.onBack=function(){
  if(G.state==='play'||G.state==='pause')togglePause();
  else if(G.state==='menu'){if(!$('title').classList.contains('hidden'))$('t_exit').click();else showScr('title')}
};
showScr('title');
if(location.search.indexOf('debug')>=0){window.__g={get G(){return G},get p(){return p},get E(){return E},get CH(){return CH},S,startRun,K,W,CHARS,choose,recalc,update,render,endRun,spawnBoss,spawnChestRandom,spawnChest,showScr,get cam(){return cam},mkEnemy,TIER}}
</script>
