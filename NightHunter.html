<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>นักล่าราตรี</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#04050d;overflow:hidden;font-family:"Noto Sans Thai","Sarabun","Tahoma",system-ui,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#0b1030}
#cv{position:absolute;left:0;top:0;width:960px;height:540px;display:block}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
button{font-family:inherit;color:#fff;border:0;cursor:pointer}
/* touch */
.tb{position:absolute;bottom:22px;width:88px;height:88px;border-radius:24px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);font-size:38px;display:flex;align-items:center;justify-content:center;color:#fff}
.tb:active,.tb.on{background:rgba(255,255,255,.35)}
#bl{left:22px}#br{left:124px}#bj{right:26px;width:104px;height:104px;border-radius:52px;font-size:34px;bottom:26px}
#bp{position:absolute;right:10px;top:70px;width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.3);font-size:20px}
/* menu */
#menu{background:radial-gradient(ellipse at 50% 0,#2a1f55 0,#0b0d24 70%);padding:14px 22px 12px}
.top{display:flex;align-items:center;gap:14px;height:44px}
.title{font-size:30px;font-weight:800;letter-spacing:1px;color:#ffd86b;text-shadow:0 2px 0 #7a3b00,0 0 18px rgba(255,170,0,.5);flex:1}
.gold{font-size:22px;font-weight:700;background:rgba(0,0,0,.4);padding:4px 16px;border-radius:20px;color:#ffe27a}
#snd{width:42px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);font-size:20px}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs button{padding:6px 26px;border-radius:10px;background:rgba(255,255,255,.1);font-size:17px;font-weight:700}
.tabs button.on{background:#e2a82b;color:#2a1600}
#mbody{flex:1;min-height:0;display:flex;gap:14px}
.chars{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;width:560px}
.cc{width:104px;height:150px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;padding:6px 2px;font-size:14px;font-weight:700;position:relative}
.cc canvas{width:76px;height:86px}
.cc.view{border-color:#ffd86b;background:rgba(255,216,107,.15)}
.cc.sel::after{content:"ใช้งาน";position:absolute;top:-8px;background:#3cb15a;font-size:11px;padding:1px 8px;border-radius:8px}
.cc .pr{font-size:13px;color:#ffe27a}.cc.lock canvas{filter:brightness(.25)}
.cc .lk{position:absolute;top:34px;font-size:26px}
.det{flex:1;background:rgba(0,0,0,.35);border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.35;overflow:hidden}
.det h2{margin:0 0 4px;font-size:24px;color:#ffd86b}
.det .sk{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;margin-top:6px}
.det .sk b{color:#9fe3ff}.det .sk.sg b{color:#ffb4f0}
.det .st{color:#b9c2ff}
.act{margin-top:8px;width:100%;padding:9px;border-radius:12px;font-size:18px;font-weight:800;background:#3cb15a}
.act.buy{background:#e2a82b;color:#2a1600}.act:disabled{background:#555;color:#999}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;width:100%;align-content:start}
.up{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:12px;padding:6px 10px;height:56px}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .tx{flex:1;font-size:14px;line-height:1.2}.up .tx b{font-size:15px}.up .tx span{color:#aab}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{width:14px;height:6px;border-radius:3px;background:#444}.pips i.f{background:#ffd86b}
.up button{background:#e2a82b;color:#2a1600;font-weight:800;border-radius:10px;padding:8px 10px;min-width:78px;font-size:14px}
.up button:disabled{background:#4a4a55;color:#999}
.bot{display:flex;align-items:center;justify-content:space-between;height:60px;padding-top:6px}
#best{font-size:16px;color:#aab}
.big{font-size:28px;font-weight:800;padding:8px 54px;border-radius:16px;background:linear-gradient(#ff9a3c,#e2531b);box-shadow:0 4px 0 #7a2a05,0 0 20px rgba(255,120,0,.45)}
.big:active{transform:translateY(2px)}
/* overlays */
.ov{background:rgba(3,4,14,.82);align-items:center;justify-content:center;gap:14px}
.ov h1{margin:0;font-size:38px;color:#ffd86b;text-shadow:0 0 18px rgba(255,170,0,.6)}
.cards{display:flex;gap:18px}
.card{width:232px;height:250px;border-radius:16px;background:linear-gradient(#2c2f5e,#181a38);border:3px solid #6f78ff;padding:14px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;position:relative}
.card:hover,.card:active{border-color:#ffd86b;transform:translateY(-4px)}
.card.new{border-color:#5de08a}.card.sig{border-color:#ff8ae6;background:linear-gradient(#4b2a5e,#1d1236)}
.card .ic{font-size:58px;line-height:70px}
.card .nm{font-size:20px;font-weight:800;margin-top:2px}
.card .lv{font-size:14px;color:#ffd86b;margin-top:2px}
.card .ds{font-size:15px;color:#d5d9ff;margin-top:8px;line-height:1.3}
.card .tg{position:absolute;top:-11px;background:#5de08a;color:#06240f;font-size:12px;font-weight:800;padding:2px 12px;border-radius:10px}
.card.sig .tg{background:#ff8ae6;color:#33002b}
.card .key{position:absolute;bottom:6px;font-size:12px;color:#889}
.rs{background:rgba(0,0,0,.4);padding:14px 34px;border-radius:16px;font-size:22px;line-height:1.6;text-align:center;min-width:330px}
.rs b{color:#ffe27a}
.btnrow{display:flex;gap:14px}
.btn{font-size:22px;font-weight:800;padding:10px 32px;border-radius:14px;background:#3cb15a}
.btn.g{background:#5a5f8a}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="touch" class="hidden">
    <div id="bl" class="tb">◀</div><div id="br" class="tb">▶</div><div id="bj" class="tb">⤒</div>
    <button id="bp">⏸</button>
  </div>
  <div id="menu" class="scr">
    <div class="top"><div class="title">⚔ นักล่าราตรี</div><div class="gold">💰 <span id="mgold">0</span></div><button id="snd">🔊</button></div>
    <div class="tabs"><button data-t="char" class="on">ตัวละคร</button><button data-t="up">อัพเกรดถาวร</button></div>
    <div id="mbody"></div>
    <div class="bot"><div id="best"></div><button id="play" class="big">▶ เริ่มเล่น</button></div>
  </div>
  <div id="lvl" class="scr ov hidden"><h1>⬆ เลเวลอัพ! เลือกสกิล</h1><div class="cards" id="cards"></div></div>
  <div id="pause" class="scr ov hidden"><h1>พักเกม</h1><div class="btnrow"><button class="btn" id="resume">▶ เล่นต่อ</button><button class="btn g" id="quit">ออกจากด่าน</button></div></div>
  <div id="over" class="scr ov hidden"><h1 id="ovt">จบเกม</h1><div class="rs" id="ovb"></div><button class="btn" id="back">กลับเมนู</button></div>
</div>
<script>
'use strict';
/* ================= พื้นฐาน ================= */
const VW=960,VH=540,WORLD=2600,GROUND=470,WAVE_LEN=25;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const FONT='"Noto Sans Thai","Sarabun","Tahoma",sans-serif';
let SC=1,PR=1;
function resize(){
  const w=innerWidth,h=innerHeight;SC=Math.min(w/VW,h/VH);
  $('stage').style.transform=`translate(${(w-VW*SC)/2}px,${(h-VH*SC)/2}px) scale(${SC})`;
  PR=Math.min(2.5,(window.devicePixelRatio||1)*SC);cv.width=Math.round(VW*PR);cv.height=Math.round(VH*PR);
}
addEventListener('resize',resize);resize();
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= เซฟ ================= */
const KEY='nightHunter_v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S=Object.assign({gold:0,owned:['knight'],sel:'knight',up:{},best:0,snd:true},S);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ================= เสียง ================= */
let AC=null;const lastSfx={};
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(f,d=.08,type='square',v=.04,slide=0,key){
  if(!S.snd||!AC)return;key=key||f;const now=AC.currentTime;
  if(lastSfx[key]&&now-lastSfx[key]<.05)return;lastSfx[key]=now;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),now+d);
  g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);
  o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+d);
}

/* ================= ข้อมูลตัวละคร ================= */
const CHARS={
  knight:{name:'อัศวินเหล็ก',price:0,hp:120,spd:230,armor:1,mod:{},color:'#5b78c8',pants:'#33405e',hat:'helmet',base:'k_slash',sig:'k_wave',
    trait:'เกราะ +1 เลือดอึด',desc:'นักรบแนวหน้า อึด ถึก ฟันกวาดรอบตัว'},
  archer:{name:'นักธนูป่า',price:300,hp:90,spd:250,armor:0,mod:{proj:.15},color:'#3f9e5a',pants:'#5a4630',hat:'hood',base:'a_arrow',sig:'a_rain',
    trait:'ความเร็วกระสุน +15%',desc:'ยิงไกล แม่นยำ ถนัดเก็บศัตรูจากระยะไกล'},
  mage:{name:'จอมเวทดารา',price:800,hp:80,spd:230,armor:0,mod:{area:.15},color:'#8a4fd6',pants:'#3a2a66',hat:'wizard',base:'m_fire',sig:'m_ice',
    trait:'ขอบเขตโจมตี +15%',desc:'ระเบิดวงกว้าง เลือดน้อยแต่ทำดาเมจแรง'},
  ninja:{name:'นินจาเงา',price:1500,hp:90,spd:290,armor:0,mod:{jump:.12},color:'#2b2b3a',pants:'#1b1b26',hat:'mask',base:'n_star',sig:'n_bomb',
    trait:'เดินไว กระโดดสูง +12%',desc:'ว่องไว ขว้างชูริเคนกลับมาเป็นบูมเมอแรง'},
  gunner:{name:'พลปืนเหล็ก',price:2500,hp:100,spd:240,armor:0,mod:{might:.1},color:'#d98a2b',pants:'#4a3a28',hat:'cap',base:'g_gun',sig:'g_rocket',
    trait:'พลังโจมตี +10%',desc:'กระสุนรัวถี่ ยิงชุดต่อเนื่อง พลังโจมตีสูง'}
};
const CHAR_ORDER=['knight','archer','mage','ninja','gunner'];

/* ================= อาวุธ / สกิล ================= */
const D=p=>['ดาเมจ +'+p+'%',s=>s.dmg*=1+p/100];
const CD=p=>['คูลดาวน์ -'+p+'%',s=>s.cd*=1-p/100];
const AM=n=>['จำนวน +'+n,s=>s.amt+=n];
const AR=p=>['ขอบเขต +'+p+'%',s=>s.area*=1+p/100];
const SP=p=>['ความเร็ว +'+p+'%',s=>s.spd*=1+p/100];
const PI=n=>['ทะลุเพิ่ม +'+n,s=>s.pierce+=n];
const DU=p=>['ระยะเวลา +'+p+'%',s=>s.dur*=1+p/100];
const SPECIAL=(t,f)=>[t,f];

const W={
 k_slash:{own:'knight',name:'ฟันดาบ',icon:'⚔️',desc:'ฟันดาบกวาดไปด้านหน้า',max:8,
  base:{dmg:14,cd:1.0,amt:1,area:1,both:0},
  steps:[D(20),AR(20),SPECIAL('ฟันทั้งสองด้าน',s=>s.both=1),D(25),AM(1),CD(20),D(35)],
  fire(i,s){
    const dirs=s.both?[p.face,-p.face]:[p.face];
    for(let k=0;k<s.amt;k++)later(k*.2,()=>{dirs.forEach(d=>shot({follow:1,ox:d*44*s.area,oy:0,r:48*s.area,dmg:s.dmg,pierce:999,life:.17,shape:'slash',dir:d,col:'#cfe4ff',kb:120}));sfx(300,.08,'sawtooth',.04,-150,'sl')});
  }},
 k_wave:{own:'knight',sig:1,name:'คลื่นกระแทก',icon:'🌊',desc:'ปล่อยคลื่นพลังวิ่งไปตามพื้นทั้งสองด้าน',max:8,
  base:{dmg:16,cd:3.2,amt:1,area:1,spd:1,pierce:999},
  steps:[D(25),AR(20),CD(15),AM(1),D(30),SP(25),D(40)],
  fire(i,s){
    for(let k=0;k<s.amt;k++)later(k*.25,()=>{[1,-1].forEach(d=>shot({x:p.x,y:p.y-22,vx:d*330*s.spd,vy:0,r:26*s.area,dmg:s.dmg,pierce:999,life:1.1,shape:'wave',dir:d,col:'#7fd0ff',hitCd:1e9,kb:160}));sfx(120,.2,'sawtooth',.05,-60,'wv')});
  }},
 a_arrow:{own:'archer',name:'ยิงธนู',icon:'🏹',desc:'ยิงลูกธนูใส่ศัตรูที่ใกล้ที่สุด',max:8,
  base:{dmg:11,cd:.95,amt:1,spd:1,pierce:1},
  steps:[D(20),AM(1),PI(1),CD(15),AM(1),D(30),PI(2)],
  fire(i,s){
    const a=aim(650);if(!a)return false;
    for(let k=0;k<s.amt;k++){const sp=(k-(s.amt-1)/2)*.16;
      later(k*.04,()=>{const an=a.an+sp;shot({x:p.x,y:p.y-24,vx:Math.cos(an)*720*s.spd,vy:Math.sin(an)*720*s.spd,r:7,dmg:s.dmg,pierce:s.pierce,life:1.2,shape:'arrow',col:'#d7f0b0'});sfx(520,.05,'triangle',.03,-200,'ar')})}
  }},
 a_rain:{own:'archer',sig:1,name:'ห่าธนู',icon:'🌧️',desc:'ลูกธนูร่วงลงมาจากฟ้าเป็นห่าฝน',max:8,
  base:{dmg:12,cd:2.6,amt:6,area:1,spd:1,pierce:2},
  steps:[AM(3),D(25),CD(15),AM(3),PI(1),D(30),AM(4)],
  fire(i,s){
    for(let k=0;k<s.amt;k++)later(k*.06,()=>{const x=p.x+rnd(-340,340)*s.area;shot({x,y:-20,vx:rnd(-40,40),vy:700*s.spd,r:7,dmg:s.dmg,pierce:s.pierce,life:1.4,shape:'arrow',col:'#ffe08a',killGround:1})});
    sfx(700,.2,'triangle',.03,-400,'rn');
  }},
 m_fire:{own:'mage',name:'ลูกไฟ',icon:'🔥',desc:'ลูกไฟพุ่งตามศัตรูแล้วระเบิดเป็นวง',max:8,
  base:{dmg:18,cd:1.5,amt:1,area:1,spd:1},
  steps:[D(20),AR(20),AM(1),CD(15),D(30),AM(1),AR(25)],
  fire(i,s){
    const a=aim(750);if(!a)return false;
    for(let k=0;k<s.amt;k++)later(k*.12,()=>{const an=a.an+(k%2?1:-1)*(k>0?.25:0);shot({x:p.x,y:p.y-24,vx:Math.cos(an)*250*s.spd,vy:Math.sin(an)*250*s.spd,r:11,dmg:s.dmg,pierce:0,life:2.6,home:1,sp:260*s.spd,expl:72*s.area,shape:'fire',col:'#ff8a2a'});sfx(240,.15,'sawtooth',.04,200,'fb')});
  }},
 m_ice:{own:'mage',sig:1,name:'พายุน้ำแข็ง',icon:'❄️',desc:'สะเก็ดน้ำแข็งพุ่งรอบตัว ทำให้ศัตรูช้าลง',max:8,
  base:{dmg:11,cd:2.8,amt:8,area:1,spd:1,pierce:1},
  steps:[AM(2),D(25),CD(15),AM(2),PI(1),D(30),AM(4)],
  fire(i,s){
    for(let k=0;k<s.amt;k++){const an=k/s.amt*Math.PI*2+rnd(0,.2);shot({x:p.x,y:p.y-22,vx:Math.cos(an)*360*s.spd,vy:Math.sin(an)*360*s.spd,r:8*s.area,dmg:s.dmg,pierce:s.pierce,life:.85*s.area,shape:'shard',rot:an,col:'#aee8ff',slow:2})}
    sfx(900,.2,'triangle',.03,-500,'ic');
  }},
 n_star:{own:'ninja',name:'ชูริเคน',icon:'⭐',desc:'ขว้างชูริเคนไปข้างหน้าแล้ววนกลับมาเหมือนบูมเมอแรง',max:8,
  base:{dmg:12,cd:1.5,amt:1,area:1,spd:1},
  steps:[D(20),AM(1),AR(25),CD(15),AM(1),D(30),SP(25)],
  fire(i,s){
    const a=aim(520)||{an:p.face>0?0:Math.PI};
    for(let k=0;k<s.amt;k++){const an=a.an+(k-(s.amt-1)/2)*.35;shot({x:p.x,y:p.y-24,vx:Math.cos(an)*520*s.spd,vy:Math.sin(an)*520*s.spd,r:14*s.area,dmg:s.dmg,pierce:999,life:4,boom:.5,sp:520*s.spd,hitCd:.35,vr:18,shape:'star',col:'#e8e8ff',kb:40})}
    sfx(600,.1,'triangle',.03,300,'ns');
  }},
 n_bomb:{own:'ninja',sig:1,name:'ระเบิดควัน',icon:'💣',desc:'วางระเบิดหน่วงเวลา ระเบิดแล้วทำให้ศัตรูช้า',max:8,
  base:{dmg:34,cd:3.4,amt:1,area:1},
  steps:[D(20),AM(1),AR(20),CD(15),D(30),AM(1),AR(25)],
  fire(i,s){
    for(let k=0;k<s.amt;k++){const ox=(k===0?0:(k%2?1:-1)*Math.ceil(k/2)*60);shot({x:p.x+ox,y:p.y-8,vx:0,vy:0,r:9,dmg:s.dmg,pierce:0,life:1.1+k*.12,noHit:1,expl:88*s.area,slow:1.5,shape:'bomb',col:'#555'})}
    sfx(200,.1,'square',.03,0,'bm');
  }},
 g_gun:{own:'gunner',name:'ยิงรัว',icon:'🔫',desc:'ยิงกระสุนรัวเป็นชุดใส่ศัตรูที่ใกล้ที่สุด',max:8,
  base:{dmg:7,cd:.9,amt:3,spd:1,pierce:0},
  steps:[D(20),AM(1),CD(15),AM(1),D(30),PI(1),AM(2)],
  fire(i,s){
    const a=aim(650)||{an:p.face>0?0:Math.PI};
    for(let k=0;k<s.amt;k++)later(k*.07,()=>{const an=a.an+rnd(-.06,.06);shot({x:p.x+Math.cos(a.an)*14,y:p.y-24,vx:Math.cos(an)*860*s.spd,vy:Math.sin(an)*860*s.spd,r:5,dmg:s.dmg,pierce:s.pierce,life:.9,shape:'bullet',col:'#ffe27a'});sfx(380,.04,'square',.025,-200,'gn')});
  }},
 g_rocket:{own:'gunner',sig:1,name:'จรวด',icon:'🚀',desc:'ยิงจรวดระเบิดวงกว้าง ดาเมจแรง',max:8,
  base:{dmg:42,cd:3.4,amt:1,area:1,spd:1},
  steps:[D(20),AR(20),AM(1),CD(15),D(30),AM(1),AR(25)],
  fire(i,s){
    const a=aim(800);if(!a)return false;
    for(let k=0;k<s.amt;k++)later(k*.2,()=>{const an=a.an+(k?rnd(-.2,.2):0);shot({x:p.x,y:p.y-24,vx:Math.cos(an)*260*s.spd,vy:Math.sin(an)*260*s.spd,r:9,dmg:s.dmg,pierce:0,life:2.2,accel:600,sp:260*s.spd,home:.4,expl:98*s.area,shape:'rocket',col:'#ff6a3a',kb:200});sfx(150,.25,'sawtooth',.05,100,'rk')});
  }},

function recalc(first){
  const ch=CHARS[p.char],L=id=>p.pass[id]||0,u=k=>S.up[k]||0,m=ch.mod;
  p.might=1+.05*u('might')+.1*L('might')+(m.might||0);
  p.armorV=(ch.armor||0)+u('armor')+L('armor');
  const old=p.maxhp||0;p.maxhp=Math.round((ch.hp+10*u('hp'))*(1+.2*L('hp')));p.hp=first?p.maxhp:Math.min(p.maxhp,p.hp+Math.max(0,p.maxhp-old));
  p.regen=.15*u('regen')+.4*L('regen');
  p.cdm=Math.max(.35,1-.025*u('cd')-.08*L('cd'));
  p.areaM=1+.1*L('area')+(m.area||0);
  p.projSpd=1+.1*L('proj')+(m.proj||0);
  p.speed=ch.spd*(1+.05*u('spd')+.1*L('spd'));
  p.magnet=1+.1*u('mag')+.25*L('mag');
  p.growth=1+.05*u('grow')+.08*L('grow');
  p.greed=1+.05*u('greed')+.1*L('greed');
  p.amountB=L('amt')+u('amt');
  p.crit=.05+.06*L('luck');
  p.jumpM=1+.06*L('jump')+(m.jump||0);
}

function pickType(){
  const w=G.wave,t=[['zombie',10],['bat',w>=2?7:0],['skeleton',w>=3?6:0],['slime',w>=5?5:0],['ghost',w>=7?4:0],['brute',w>=9?Math.min(8,(w-8)*1.2):0]];
  let sum=0;t.forEach(a=>sum+=a[1]);let r=Math.random()*sum;for(const a of t){if((r-=a[1])<=0)return a[0]}return'zombie';
}
function mkEnemy(type,x,y){
  const d=EN[type],w=G.wave;
  const hpM=1+.22*(w-1)+.012*(w-1)*(w-1),dmgM=1+.05*(w-1),spdM=Math.min(1.5,1+.015*(w-1));
  const e={type,x,y,vx:0,vy:0,r:d.r,hp:d.hp*hpM*(d.boss?1+w*.05:1),spd:d.spd*spdM*rnd(.9,1.1),dmg:d.dmg*dmgM,xp:d.xp,kind:d.kind,boss:!!d.boss,jump:d.jump,ghost:d.ghost,slow:0,flash:0,kx:0,t:rnd(0,6),jcd:rnd(0,2),hc:{},on:false,dead:false,charge:0,cdT:rnd(2,4)};

}
function spawnAt(type){

  if(x<10||x>WORLD-10){side=-side;x=side<0?cam.x-40:cam.x+VW+40}
  x=clamp(x,10,WORLD-10);
  const d=EN[type];let y=d.kind==='fly'?rnd(80,340):GROUND-d.r;
  return mkEnemy(type,x,y);
}
function spawnEnemy(){if(E.length>=Math.min(170,60+G.wave*5))return;spawnAt(pickType())}
function spawnBurst(){const n=Math.min(34,4+Math.floor(G.wave*1.6));for(let i=0;i<n;i++)spawnEnemy()}

function groundPhys(o,h,dt,wasFeet){
  // o.y = feet position for player (h=0) ; for enemy: center with radius h
  const feet=o.y+h;let on=false;
  if(feet>=GROUND){o.y=GROUND-h;o.vy=0;on=true}
  else if(o.vy>=0){for(const pl of PLAT){if(o.x>pl.x-4&&o.x<pl.x+pl.w+4&&wasFeet<=pl.y+3&&feet>=pl.y){o.y=pl.y-h;o.vy=0;on=true;break}}}
  return on;
}
function updPlayer(dt){
  const ax=(K.r?1:0)-(K.l?1:0);
  p.vx+=(ax*p.speed-p.vx)*Math.min(1,dt*(ax?16:12));
  if(ax){p.face=ax;p.walk+=dt}
  if(K.j&&!p.jh)p.jb=.12;
  if(!K.j&&p.jh&&p.vy<0)p.vy*=.5;
  p.jh=K.j;
  p.coy-=dt;p.jb-=dt;if(p.on)p.coy=.1;
  if(p.jb>0&&p.coy>0){p.vy=-700*p.jumpM;p.on=false;p.coy=0;p.jb=0;sfx(330,.12,'square',.03,300,'jp')}
  const wf=p.y;p.vy+=1700*dt;p.y+=p.vy*dt;p.x=clamp(p.x+p.vx*dt,16,WORLD-16);
  p.on=groundPhys(p,0,dt,wf);
  if(p.regen>0)p.hp=Math.min(p.maxhp,p.hp+p.regen*dt);
  p.inv-=dt;p.flash-=dt;
  for(const i of p.wp){const d=W[i.id],s=wstats(i);if(d.update)d.update(i,s,dt);else{i.t-=dt;if(i.t<=0){const r=d.fire(i,s);i.t=r===false?.12:s.cd}}}
}

function rollOptions(){
  const pool=[];
  for(const id in W){const d=W[id];if(d.own&&d.own!==p.char)continue;const inst=p.wp.find(i=>i.id===id);
    if(inst){if(inst.lvl<d.max)pool.push({kind:'w',id,w:1,lvl:inst.lvl})}
    else if(p.wp.length<6)pool.push({kind:'w',id,w:d.sig?1.8:1,lvl:0})}
  for(const id in PASS){const d=PASS[id],l=p.pass[id]||0;
    if(l>0){if(l<d.max)pool.push({kind:'p',id,w:1,lvl:l})}
    else if(Object.keys(p.pass).length<6)pool.push({kind:'p',id,w:1,lvl:0})}

  while(out.length<3&&pool.length){let sum=0;pool.forEach(o=>sum+=o.w);let r=Math.random()*sum,k=0;for(;k<pool.length;k++){if((r-=pool[k].w)<=0)break}k=Math.min(k,pool.length-1);out.push(pool.splice(k,1)[0])}

  return out;
}

   case'arrow':{const a=Math.atan2(q.vy,q.vx);c.rotate(a);c.strokeStyle=q.col;c.lineWidth=2.5;c.beginPath();c.moveTo(-14,0);c.lineTo(8,0);c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(14,0);c.lineTo(6,-4);c.lineTo(6,4);c.fill();c.strokeStyle='#8a6a3a';c.beginPath();c.moveTo(-14,0);c.lineTo(-18,-3);c.moveTo(-14,0);c.lineTo(-18,3);c.stroke();break}
   case'bullet':{const a=Math.atan2(q.vy,q.vx);c.rotate(a);c.shadowColor='#fd0';c.shadowBlur=8;c.fillStyle=q.col;c.fillRect(-8,-2.5,16,5);break}
   case'shard':{c.rotate(q.rot);c.fillStyle='#bff';c.shadowColor='#8df';c.shadowBlur=10;c.beginPath();c.moveTo(12,0);c.lineTo(-6,-5);c.lineTo(-3,0);c.lineTo(-6,5);c.fill();break}
   case'star':{c.rotate(q.rot);c.shadowColor='#aaf';c.shadowBlur=8;c.fillStyle=q.col;c.beginPath();for(let k=0;k<4;k++){const a=k*Math.PI/2;c.lineTo(Math.cos(a)*q.r,Math.sin(a)*q.r);c.lineTo(Math.cos(a+.78)*q.r*.3,Math.sin(a+.78)*q.r*.3)}c.fill();break}
   case'axe':{c.rotate(q.rot);c.fillStyle='#8a5a2a';c.fillRect(-2,-q.r,4,q.r*2);c.fillStyle='#dfe6f0';c.beginPath();c.moveTo(2,-q.r);c.quadraticCurveTo(q.r+6,-q.r*.2,2,q.r*.4);c.fill();break}
   case'rocket':{const a=Math.atan2(q.vy,q.vx);c.rotate(a);c.fillStyle='#ccc';c.fillRect(-10,-4,20,8);c.fillStyle='#e33';c.beginPath();c.moveTo(10,-4);c.lineTo(18,0);c.lineTo(10,4);c.fill();c.fillStyle='#fa3';c.beginPath();c.moveTo(-10,-3);c.lineTo(-20-Math.random()*6,0);c.lineTo(-10,3);c.fill();break}
   case'bomb':{const bl=q.life<.4&&Math.floor(q.life*20)%2;c.fillStyle=bl?'#f44':'#333';circ(0,0,q.r);c.strokeStyle='#fb4';c.lineWidth=2;c.beginPath();c.moveTo(0,-q.r);c.lineTo(4,-q.r-6);c.stroke();c.fillStyle='#ff0';circ(4,-q.r-7,2.5);break}
   case'slash':{c.scale(q.dir,1);const k=1-q.life/.17;c.globalAlpha=.9*(1-k*.6);c.strokeStyle=q.col;c.lineWidth=9;c.shadowColor='#8cf';c.shadowBlur=12;c.beginPath();c.arc(-q.ox*q.dir*.55,0,q.r*1.05,-1.1+k*.5,1.1+k*.5);c.stroke();break}
   case'wave':{c.scale(q.dir,1);c.fillStyle='rgba(127,208,255,.75)';c.shadowColor='#7fd0ff';c.shadowBlur=12;c.beginPath();c.moveTo(-q.r*.5,q.r);c.quadraticCurveTo(q.r*1.1,q.r*.4,q.r*.6,-q.r);c.quadraticCurveTo(q.r*.1,-q.r*.1,-q.r*.5,q.r);c.fill();break}
  }
  c.restore();
}
function bgDraw(){
  const g=c.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#090b26');g.addColorStop(.6,'#2a1d4d');g.addColorStop(1,'#6a3463');c.fillStyle=g;c.fillRect(0,0,VW,VH);
  c.fillStyle='#fff';for(const s of STARS){c.globalAlpha=.4+.6*Math.abs(Math.sin(G.time*.8+s.a*9));c.fillRect((s.x-cam.x*.05+VW*3)%(VW*1.3),s.y,s.s,s.s)}c.globalAlpha=1;
  const mx=780-cam.x*.08;c.fillStyle='#fff4c9';c.shadowColor='#fff4c9';c.shadowBlur=40;circ(mx,92,34);c.shadowBlur=0;c.fillStyle='rgba(120,100,140,.35)';circ(mx-9,86,8);circ(mx+10,100,5);
  const layer=(par,col,base,amp)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,VH);for(let x=0;x<=VW+20;x+=20){const wx=x+cam.x*par;c.lineTo(x,GROUND-base-(Math.sin(wx*.004)*amp+Math.sin(wx*.011)*amp*.5))}c.lineTo(VW+20,VH);c.fill()};
  layer(.2,'#241a4a',90,50);layer(.45,'#1a1338',40,30);
}
function worldDraw(){
  for(const d of DECOR){const x=d.x;if(x<cam.x-60||x>cam.x+VW+60)continue;c.save();c.translate(x,GROUND);c.scale(d.s,d.s);
    if(d.t===0){c.fillStyle='#4a4e6b';c.beginPath();c.moveTo(-9,0);c.lineTo(-9,-22);c.arc(0,-22,9,Math.PI,0);c.lineTo(9,0);c.fill();c.fillStyle='#363a54';c.fillRect(-2,-26,4,10);c.fillRect(-6,-21,12,3)}
    else{c.strokeStyle='#1c1a2e';c.lineWidth=5;c.beginPath();c.moveTo(0,0);c.lineTo(0,-50);c.moveTo(0,-30);c.lineTo(-16,-48);c.moveTo(0,-38);c.lineTo(14,-56);c.stroke()}c.restore()}
  c.fillStyle='#1b1830';c.fillRect(cam.x-10,GROUND,VW+20,VH-GROUND);c.fillStyle='#2f7a55';c.fillRect(cam.x-10,GROUND,VW+20,7);c.fillStyle='#3d9a6a';c.fillRect(cam.x-10,GROUND,VW+20,3);
  c.fillStyle='#262244';for(let x=Math.floor(cam.x/48)*48;x<cam.x+VW+48;x+=48)c.fillRect(x,GROUND+22,40,4);
  for(const pl of PLAT){if(pl.x+pl.w<cam.x||pl.x>cam.x+VW)continue;c.fillStyle='#3b4468';c.fillRect(pl.x,pl.y,pl.w,16);c.fillStyle='#6ea57f';c.fillRect(pl.x,pl.y,pl.w,5);c.fillStyle='#2a3150';c.fillRect(pl.x,pl.y+12,pl.w,4)}
  // ขอบโลก
  c.fillStyle='rgba(255,80,80,.25)';if(cam.x<2)c.fillRect(0,0,6,GROUND);if(cam.x>WORLD-VW-2)c.fillRect(WORLD-6,0,6,GROUND);
}
function drawBar(x,y,w,h,v,col,bg='rgba(0,0,0,.55)'){c.fillStyle=bg;c.fillRect(x,y,w,h);c.fillStyle=col;c.fillRect(x,y,w*clamp(v,0,1),h)}
function hud(){
  c.setTransform(PR,0,0,PR,0,0);
  drawBar(0,0,VW,14,G.xp/G.need,'#3aa0ff','rgba(0,0,0,.6)');
  c.font=`bold 12px ${FONT}`;c.fillStyle='#fff';c.textAlign='right';c.fillText('เลเวล '+G.lvl,VW-8,11);
  drawBar(12,22,210,18,p.hp/p.maxhp,'#e23b4a');c.strokeStyle='rgba(255,255,255,.5)';c.strokeRect(12,22,210,18);
  c.textAlign='center';c.font=`bold 13px ${FONT}`;c.fillStyle='#fff';c.fillText('❤ '+Math.ceil(p.hp)+' / '+p.maxhp,117,36);
  c.textAlign='left';c.font='20px '+FONT;let x=12;
  for(const i of p.wp){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(x,46,30,30);c.fillStyle='#fff';c.font='20px '+FONT;c.fillText(W[i.id].icon,x+3,69);c.font=`bold 11px ${FONT}`;c.fillStyle=i.lvl>=W[i.id].max?'#ffd86b':'#fff';c.fillText(i.lvl>=W[i.id].max?'MAX':i.lvl,x+16,74);x+=32}
  x=12;for(const k in p.pass){c.fillStyle='rgba(0,0,0,.4)';c.fillRect(x,80,24,24);c.font='15px '+FONT;c.fillStyle='#fff';c.fillText(PASS[k].icon,x+3,98);c.font=`bold 10px ${FONT}`;c.fillText(p.pass[k],x+15,104);x+=26}
  c.textAlign='center';c.font=`bold 22px ${FONT}`;c.fillStyle='#ffe27a';c.shadowColor='#000';c.shadowBlur=4;c.fillText('เวฟ '+G.wave,VW/2,40);
  const m=Math.floor(G.time/60),s=Math.floor(G.time%60);c.font=`bold 15px ${FONT}`;c.fillStyle='#fff';c.fillText(m+':'+String(s).padStart(2,'0'),VW/2,58);
  c.shadowBlur=0;drawBar(VW/2-60,64,120,5,G.waveT/WAVE_LEN,'#ffb347');
  c.textAlign='right';c.font=`bold 18px ${FONT}`;c.fillStyle='#ffe27a';c.fillText('💰 '+Math.floor(G.gold),VW-12,38);c.fillStyle='#fff';c.fillText('☠ '+G.kills,VW-12,60);
  const boss=E.find(e=>e.boss&&!e.dead);if(boss){drawBar(VW/2-150,76,300,10,boss.hp/boss.max,'#d22');c.font=`bold 12px ${FONT}`;c.fillStyle='#fff';c.textAlign='center';c.fillText('👹 บอส',VW/2,98)}
  if(G.banner){const b=G.banner,a=Math.min(1,b.t*2,(2.6-b.t)*3+.2);c.globalAlpha=clamp(a,0,1);c.textAlign='center';c.font=`bold 52px ${FONT}`;c.lineWidth=7;c.strokeStyle='#000';c.strokeText(b.txt,VW/2,190);c.fillStyle='#ffd86b';c.fillText(b.txt,VW/2,190);c.globalAlpha=1}
  c.textAlign='left';
}
function render(){
  c.setTransform(PR,0,0,PR,0,0);
  cam.sx=cam.shake?rnd(-cam.shake,cam.shake):0;cam.sy=cam.shake?rnd(-cam.shake,cam.shake):0;
  bgDraw();
  c.save();c.translate(-cam.x+cam.sx,cam.sy);
  worldDraw();
  for(const g of GEM){c.fillStyle=g.v>=5?'#ff5a6a':g.v>=2?'#4de08a':'#4db8ff';c.shadowColor=c.fillStyle;c.shadowBlur=8;c.beginPath();c.moveTo(g.x,g.y-6);c.lineTo(g.x+5,g.y);c.lineTo(g.x,g.y+6);c.lineTo(g.x-5,g.y);c.fill()}c.shadowBlur=0;
  for(const g of COIN){c.fillStyle='#ffcc2e';circ(g.x,g.y,6);c.fillStyle='#fff2a0';circ(g.x-1.5,g.y-1.5,2.5)}
  for(const g of HRT){c.font='18px '+FONT;c.fillText('❤️',g.x-9,g.y+6)}
  for(const e of E)if(e.x>cam.x-80&&e.x<cam.x+VW+80)drawEnemy(e);
  // ผู้เล่น + อาวุธถาวร
  for(const i of p.wp){const d=W[i.id];if(d.draw)d.draw(i,wstats(i))}
  if(!(p.inv>0&&Math.floor(G.time*24)%2)){if(p.flash>0)c.globalAlpha=.6;drawHeroCtx(c,p.char,p.x,p.y,p.face,p.walk,Math.abs(p.vx)>30,!p.on);c.globalAlpha=1}
  drawBar(p.x-15,p.y+5,30,4,p.hp/p.maxhp,'#e23b4a');
  for(const q of P)drawProj(q);
  for(const f of FX){const k=f.t/f.life;
    if(f.kind==='ring'){c.strokeStyle=f.col;c.globalAlpha=1-k;c.lineWidth=6*(1-k)+1;c.beginPath();c.arc(f.x,f.y,f.r*(.4+.6*k),0,7);c.stroke();c.globalAlpha=1}
    else if(f.kind==='bolt'){c.strokeStyle='#fffbb0';c.shadowColor='#ff0';c.shadowBlur=18;c.lineWidth=4*(1-k)+1;c.beginPath();let y=-10,x=f.x+rnd(-25,25);c.moveTo(x,y);while(y<f.y){y+=34;x=f.x+rnd(-14,14);c.lineTo(x,Math.min(y,f.y))}c.lineTo(f.x,f.y);c.stroke();c.shadowBlur=0}}
  for(const q of PART){c.globalAlpha=clamp(q.life/q.l0,0,1);c.fillStyle=q.col;c.fillRect(q.x,q.y,q.size,q.size)}c.globalAlpha=1;
  c.font=`bold 15px ${FONT}`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.8)';
  for(const t of TXT){c.globalAlpha=clamp(t.life*2,0,1);c.strokeText(t.t,t.x,t.y);c.fillStyle=t.col;c.fillText(t.t,t.x,t.y)}c.globalAlpha=1;c.textAlign='left';
  c.restore();
  if(p.hp<p.maxhp*.3){c.fillStyle='rgba(255,0,0,'+(.1+.08*Math.sin(G.time*8))+')';c.fillRect(0,0,VW,VH)}
  hud();
}

/* ================= ลูป ================= */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(G.state==='play'){update(dt);if(G.state==='play'||G.state==='levelup'||G.state==='over')render()}
  else if(G.state==='levelup'||G.state==='pause'||G.state==='over'){render()}
  else if(G.state==='menu'){c.setTransform(PR,0,0,PR,0,0);G.time+=dt;cam.x=0;cam.sx=cam.sy=0;bgDraw();c.save();c.translate(-cam.x,0);worldDraw();c.restore()}
}
requestAnimationFrame(loop);

/* ================= ควบคุม ================= */
const keymap={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j'};
addEventListener('keydown',e=>{
  audio();const k=keymap[e.key];if(k){K[k]=1;e.preventDefault()}
  if(e.key==='Escape'||e.key==='p'||e.key==='P')togglePause();
  if(G.state==='levelup'&&'123'.includes(e.key)&&e.key)choose(+e.key-1);
});
addEventListener('keyup',e=>{const k=keymap[e.key];if(k)K[k]=0});
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const el=$(id);
  el.addEventListener('pointerdown',e=>{audio();K[k]=1;el.classList.add('on');el.setPointerCapture&&el.setPointerCapture(e.pointerId);e.preventDefault()});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{K[k]=0;el.classList.remove('on')}));
});
function togglePause(){
  if(G.state==='play'){G.state='pause';K.l=K.r=K.j=0;$('pause').classList.remove('hidden')}
  else if(G.state==='pause'){G.state='play';$('pause').classList.add('hidden')}
}
$('bp').addEventListener('pointerdown',e=>{e.stopPropagation();togglePause()});
$('resume').onclick=togglePause;
$('quit').onclick=()=>{$('pause').classList.add('hidden');G.quit=1;endRun()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')togglePause()});
$('back').onclick=()=>{$('over').classList.add('hidden');G.state='menu';$('menu').classList.remove('hidden');renderMenu()};

/* ================= เมนู ================= */
let tab='char',view=S.sel;
function renderMenu(){
  $('mgold').textContent=S.gold;$('best').textContent='เวฟสูงสุด: '+S.best;$('snd').textContent=S.snd?'🔊':'🔇';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const mb=$('mbody');
  if(tab==='char'){
    const own=id=>S.owned.includes(id),v=CHARS[view],bw=W[v.base],sw=W[v.sig];
    mb.innerHTML=`<div class="chars">${CHAR_ORDER.map(id=>{const d=CHARS[id];return `<div class="cc ${own(id)?'':'lock'} ${id===S.sel?'sel':''} ${id===view?'view':''}" data-id="${id}"><canvas width="152" height="172" data-h="${id}"></canvas>${own(id)?'':'<div class="lk">🔒</div>'}<div>${d.name}</div>${own(id)?'':`<div class="pr">💰 ${d.price}</div>`}</div>`}).join('')}</div>
    <div class="det"><h2>${v.name}</h2><div>${v.desc}</div><div class="st">❤ เลือด ${v.hp} · 🏃 ความเร็ว ${v.spd} · ${v.trait}</div>
    <div class="sk"><b>${bw.icon} สกิลเริ่มต้น: ${bw.name}</b><br>${bw.desc}</div>
    <div class="sk sg"><b>${sw.icon} สกิลประจำตัว: ${sw.name}</b><br>${sw.desc}<br><span style="color:#aab;font-size:12px">* สุ่มมาให้เลือกตอนเลเวลอัพ เริ่มทุกรอบที่ Lv.1</span></div>
    ${own(view)?`<button class="act" id="act" ${view===S.sel?'disabled':''}>${view===S.sel?'กำลังใช้ตัวละครนี้':'เลือกตัวละครนี้'}</button>`:`<button class="act buy" id="act" ${S.gold<v.price?'disabled':''}>ซื้อ 💰 ${v.price}</button>`}</div>`;
    mb.querySelectorAll('canvas[data-h]').forEach(cn=>{const g=cn.getContext('2d');g.scale(2,2);g.translate(38,70);g.scale(1.25,1.25);g.translate(-0,-2);drawHeroCtx(g,cn.dataset.h,0,0,1,0,false,false)});
  }else{
    mb.innerHTML=`<div class="ups">${META.map(m=>{const l=S.up[m.k]||0,mx=l>=m.max,cost=metaCost(m,l);return `<div class="up"><div class="ic">${m.i}</div><div class="tx"><b>${m.n}</b> <span>${m.d}</span><div class="pips">${Array.from({length:m.max},(_,i)=>`<i class="${i<l?'f':''}"></i>`).join('')}</div></div><button data-k="${m.k}" ${mx||S.gold<cost?'disabled':''}>${mx?'MAX':'💰 '+cost}</button></div>`}).join('')}</div>`;
  }
}
$('mbody').addEventListener('click',e=>{
  audio();
  const cc=e.target.closest('.cc');if(cc){view=cc.dataset.id;if(S.owned.includes(view)){S.sel=view;persist()}renderMenu();return}
  if(e.target.id==='act'){
    if(S.owned.includes(view)){S.sel=view}
    else if(S.gold>=CHARS[view].price){S.gold-=CHARS[view].price;S.owned.push(view);S.sel=view;sfx(900,.3,'triangle',.06,600,'by')}
    persist();renderMenu();return}
  const ub=e.target.closest('button[data-k]');
  if(ub){const m=META.find(x=>x.k===ub.dataset.k),l=S.up[m.k]||0,cost=metaCost(m,l);if(l<m.max&&S.gold>=cost){S.gold-=cost;S.up[m.k]=l+1;persist();sfx(900,.2,'triangle',.06,600,'by');renderMenu()}}
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderMenu()});
$('snd').onclick=()=>{S.snd=!S.snd;persist();audio();renderMenu()};
$('play').onclick=()=>{view=S.sel;startRun()};
renderMenu();
if(location.search.indexOf('debug')>=0){window.__g={get G(){return G},get p(){return p},get E(){return E},S,startRun,K,W,CHARS,PASS,choose,recalc,update,render,endRun,spawnBoss,get cam(){return cam}}}
</script>
</body>
